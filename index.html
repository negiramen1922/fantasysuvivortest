<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0818">
<title>勇者サバイバー — プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0b0818;
  --deep:#150f2c;
  --panel:#1d1540;
  --line:#3b2d6b;
  --gold:#ffcc4d;
  --arc:#56e0ff;
  --blood:#ff4d6d;
  --violet:#9b7bff;
  --ash:#a99fd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;height:100dvh;
  background:var(--void);
  color:#efeaff;
  font-family:'DotGothic16',"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
#wrap{
  position:relative;width:100%;height:100%;
  max-width:980px;max-height:660px;
  border:2px solid var(--line);
  background:var(--deep);
  box-shadow:0 0 0 1px #000, 0 24px 60px rgba(0,0,0,.7);
  overflow:hidden;touch-action:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none}
@media (max-width:820px){
  #wrap{max-width:none;max-height:none;border:none;box-shadow:none}
}

/* ---- HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;font-size:14px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#xpwrap{position:absolute;top:0;left:0;right:0;height:14px;background:#0e0a1f;border-bottom:1px solid var(--line)}
#xpbar{height:100%;width:0%;background:linear-gradient(90deg,#3a7bff,var(--arc));transition:width .12s linear}
#topline{position:absolute;top:20px;left:0;right:0;display:flex;justify-content:center;gap:26px;text-shadow:0 2px 0 #000}
#timer{font-size:26px;color:var(--gold);letter-spacing:2px}
.stat{font-size:15px;color:var(--ash);align-self:flex-end;padding-bottom:4px}
.stat b{color:#fff;font-weight:normal}
#subline{position:absolute;top:52px;left:0;right:0;display:flex;justify-content:center;
  gap:18px;align-items:baseline;text-shadow:0 2px 0 #000}
#score{font-size:21px;color:#fff;letter-spacing:1px}
#score i{font-size:11px;color:var(--ash);font-style:normal;margin-right:5px;letter-spacing:2px}
#coins{font-size:13px;color:var(--ash)}
#coins .sv{color:#cfd8e8}
#coins .gd{color:var(--gold)}
#bosswrap{position:absolute;top:72px;left:50%;transform:translateX(-50%);
  width:min(74%,460px);display:none}
#bosswrap.on{display:block}
#bossnm{font-size:13px;color:#ffb0be;text-align:center;text-shadow:0 2px 0 #000;margin-bottom:3px}
#bossbg{height:11px;background:#12081a;border:1px solid #6b2540}
#bossbar{height:100%;width:100%;background:linear-gradient(90deg,#8e0f2c,var(--blood));transition:width .12s}
@media (max-width:820px){ #bosswrap{top:62px;width:84%} #bossnm{font-size:11px} }
#perf{position:absolute;left:12px;bottom:74px;font-size:11px;line-height:1.5;
  color:#6b5f9c;text-shadow:0 1px 0 #000;pointer-events:none;display:none}
#perf.on{display:block}
#perf b{font-weight:normal}
#perf .ok{color:#7be08a}
#perf .mid{color:var(--gold)}
#perf .bad{color:var(--blood)}
@media (max-width:820px){ #perf{left:10px;bottom:62px;font-size:10px} }
#hpwrap{position:absolute;left:14px;bottom:14px;width:220px;max-width:44%}
#hpbg{height:16px;background:#0e0a1f;border:1px solid var(--line)}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#c0203f,var(--blood));transition:width .15s}
#hptext{font-size:13px;color:var(--ash);margin-top:3px}
#slots{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;
  gap:5px;align-items:flex-end;max-width:56%}
.srow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.srow:empty{display:none}
.slot{position:relative;width:46px;height:46px;border-radius:50%}
.sring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -90deg, var(--arc) var(--p,100%), #2b2150 0)}
.sin{position:absolute;inset:3px;border-radius:50%;background:rgba(20,14,45,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.slot .ic{font-size:18px;line-height:1}
.slot .lv{font-size:10px;color:var(--gold);line-height:1.1}
.slot.evo .sring{background:conic-gradient(from -90deg, var(--gold) var(--p,100%), #4a3a12 0)}
.slot.evo{box-shadow:0 0 12px rgba(255,204,77,.5);border-radius:50%}
.slot.pas .sring{background:#2b2150}
.slot.pas .lv{color:var(--ash)}
.slot.eq .sring{background:#1c4a55}
.slot.eq{box-shadow:0 0 8px rgba(127,230,255,.35)}
.slot.eq .lv{color:#7fe6ff}

#banner{position:absolute;left:0;right:0;top:31%;text-align:center;font-size:40px;
  color:var(--gold);letter-spacing:9px;opacity:0;
  text-shadow:0 0 26px rgba(255,204,77,.75),0 4px 0 #3a2400}
#banner.go{animation:bn 2s ease-out forwards}
@keyframes bn{
  0%{opacity:0;transform:scale(1.5)}
  14%{opacity:1;transform:scale(1)}
  72%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04)}
}
@media (prefers-reduced-motion:reduce){ #banner.go{animation:bn 2s steps(2) forwards} }

#pausebtn{position:absolute;top:24px;right:16px;pointer-events:auto;cursor:pointer;
  width:38px;height:34px;background:rgba(20,14,45,.85);border:1px solid var(--line);
  color:var(--ash);font-family:inherit;font-size:15px;line-height:1;letter-spacing:1px;transition:.12s}
#pausebtn:hover,#pausebtn:focus-visible{color:var(--gold);border-color:var(--gold);outline:none}
#psetbtn{position:absolute;top:16px;right:16px;z-index:2;width:46px;height:46px;cursor:pointer;
  background:transparent;color:var(--ash);border:2px solid var(--line);font-size:20px;transition:.12s}
#psetbtn:hover,#psetbtn:focus-visible{color:var(--arc);border-color:var(--arc);outline:none}
#paused{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,16,.88);text-align:center;padding:24px}
#paused.on{display:flex}
#pstat{font-size:14px;color:var(--ash);line-height:1.9;margin-top:16px}
#pstat b{color:#fff;font-weight:normal}
#pstat .el{color:var(--gold)}

#shop,#mast,#ban,#settings,#news{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,16,.95);padding:14px;z-index:6}
#shop.on,#mast.on,#ban.on,#settings.on,#news.on{display:flex}
.vview{display:none;flex-direction:column;align-items:center;width:100%;max-width:540px}
#homehead{position:absolute;top:16px;right:16px;display:flex;gap:10px;z-index:2}
.hicon{width:46px;height:46px;font-size:20px;cursor:pointer;pointer-events:auto;
  background:transparent;color:var(--ash);border:2px solid var(--line);position:relative}
.hicon:hover,.hicon:focus-visible{border-color:var(--arc);color:var(--arc);outline:none}
.btn.big{font-size:30px;padding:18px 76px;letter-spacing:10px;margin-top:20px}
#homemenu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px auto 0;width:100%;max-width:400px}
#homemenu .btn{margin-top:0;width:100%;padding:13px 0;font-size:16px;letter-spacing:3px}
#stagechar{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;color:#fff;font-size:18px}
#stagechar .chg{font-size:28px}
#stagechar .chw{font-size:12px;color:var(--ash)}
#stageview #stagesel{margin-top:14px}
#resbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;flex:none}
#resultview{max-height:calc(100vh - 24px)}
#resultview .title{flex:none}
#resultview #res{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.setrow>span:first-child{color:#e9e2ff;flex:none}
.setval{color:var(--arc);width:52px;text-align:right;flex:none}
#volm,#vols,#volb{flex:1;accent-color:#56e0ff}
#setbody,#newslist{width:100%;max-width:440px;margin:0 auto;text-align:left}
#newslist{flex:1;min-height:0;overflow-y:auto}
.newsitem{padding:11px 4px;border-bottom:1px solid var(--line)}
.newsitem .nt{color:var(--gold);font-size:14px}
.newsitem .nd{color:#6b5f9c;font-size:11px;margin-left:8px}
.newsitem .nb{color:#cfc9e8;font-size:12px;line-height:1.6;margin-top:4px}
.hicon .badge{position:absolute;top:-6px;right:-6px}
#banlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:4px 0}
.banw{display:flex;flex-direction:column;align-items:center;gap:2px;width:88px;padding:8px 4px;
  cursor:pointer;background:transparent;color:var(--ash);border:2px solid var(--line);font-family:inherit}
.banw .g{font-size:20px}
.banw .n{font-size:11px;color:#cfc9e8}
.banw .x{font-size:10px;color:#ff6b6b;font-weight:bold}
.banw:hover:not(.on){border-color:var(--ash)}
.banw.on{border-color:#ff5a5a;background:rgba(120,30,30,.3)}
.banw.on .n{color:#ff9d9d}
#mastlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:6px;padding:8px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#mastlist .card{width:100%}
.shopbox{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;gap:10px}
.shophead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shophead .title{font-size:23px;letter-spacing:5px}
#purse{font-size:14px;white-space:nowrap}
#purse .sv{color:#cfd8e8}
#purse .gd{color:var(--gold);margin-left:10px}
#upglist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:6px;padding:8px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.upg{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);padding:8px 10px}
.upg.max{border-color:var(--gold)}
.ug{font-size:19px;flex:0 0 26px;text-align:center}
.ub{flex:1;min-width:0;text-align:left}
.un{font-size:15px;color:#fff}
.un .uv{color:var(--arc);font-size:13px;margin-left:7px}
.ud{font-size:11px;color:var(--ash);line-height:1.5}
.pips{margin-top:2px;letter-spacing:3px;font-size:11px;color:#3b2d6b}
.pips b{color:var(--arc);font-weight:normal}
.pips i{color:var(--gold);font-style:normal}
.ubuy{flex:0 0 auto;cursor:pointer;font-family:inherit;font-size:13px;padding:9px 11px;
  background:transparent;border:1px solid var(--line);color:#cfd8e8;transition:.12s;white-space:nowrap}
.ubuy:hover:not(:disabled),.ubuy:focus-visible:not(:disabled){border-color:var(--arc);color:#fff;outline:none}
.ubuy.gd{border-color:#6b5324;color:var(--gold)}
.ubuy.gd:hover:not(:disabled){border-color:var(--gold)}
.ubuy:disabled{opacity:.3;cursor:default}
#vbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#vbtns .btn{margin-top:22px}
#stagesel{margin-top:20px}
.stlabel{font-size:11px;color:var(--ash);letter-spacing:.14em;margin-bottom:8px}
.strow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;
  padding:9px 14px;cursor:pointer;background:transparent;color:var(--ash);
  border:2px solid var(--line);font-family:inherit}
.stbtn b{font-size:15px;color:#fff}
.stbtn span{font-size:10px;color:var(--ash)}
.stbtn:hover:not(:disabled):not(.sel){border-color:var(--ash)}
.stbtn.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(255,204,77,.25)}
.stbtn.lock{opacity:.5;cursor:default}
.stbtn.lock b{color:var(--ash)}
.btn.sub2{border-color:var(--line);color:var(--ash)}
.btn.sub2:hover,.btn.sub2:focus-visible{background:var(--line);color:#fff}

.wm{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);padding:9px 10px}
.wm.rdy{border-color:var(--gold);box-shadow:0 0 14px rgba(255,204,77,.25)}
.wmb{flex:1;min-width:0;text-align:left}
.wmn{font-size:15px;color:#fff}
.wmn span{font-size:11px;color:var(--ash);margin-left:7px}
.wbar{height:6px;background:#0e0a1f;border:1px solid var(--line);margin:5px 0 4px}
.wbar div{height:100%;background:linear-gradient(90deg,#3a7bff,var(--arc))}
.wtr{font-size:11px;color:var(--arc);line-height:1.55}
.wtr .no{color:#4d4275}
.badge{display:inline-block;background:var(--gold);color:#1a1000;font-size:10px;
  padding:1px 6px;margin-left:6px;vertical-align:middle}

#popt{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;
  font-size:12px;color:var(--ash);flex-wrap:wrap}
.psec{margin:10px 0 3px;color:var(--gold);font-size:13px;letter-spacing:2px}
.wrow{display:flex;align-items:center;gap:7px;justify-content:center;margin:3px 0;font-size:14px}
.wrow .wg{font-size:20px;line-height:1}
#pbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#pbtns .btn{margin-top:22px}
.btn.warn{border-color:var(--blood);color:var(--blood)}
.btn.warn:hover,.btn.warn:focus-visible{background:var(--blood);color:#1a0006}

#chest{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,16,.9);z-index:6;padding:16px}
#chest.on{display:flex}
.cbox{display:flex;flex-direction:column;align-items:center;gap:12px}
#chring{position:relative;width:284px;height:284px}
#cctr{position:absolute;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:1px solid var(--line);background:rgba(20,14,45,.6)}
#cctrn{font-size:32px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 20px rgba(255,204,77,.6)}
#cctrl{font-size:11px;color:var(--ash);letter-spacing:3px}
.ccell{position:absolute;border:1px solid var(--line);background:#1a1330;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:opacity .2s,border-color .15s}
.ccell .cg{font-size:22px;line-height:1}
.ccell .cn{font-size:8px;color:var(--ash);line-height:1.1;text-align:center}
.ccell.win{border-color:#fff;background:#2a1f10;box-shadow:0 0 22px rgba(255,204,77,.65)}
.ccell.win .cn{color:var(--gold)}
.ccell.dim{opacity:.28}
.cmark{position:absolute;pointer-events:none;border:3px solid var(--gold);
  box-shadow:0 0 18px rgba(255,204,77,.75)}
.cmark.m1{border-color:var(--arc);box-shadow:0 0 18px rgba(86,224,255,.75)}
.cmark.m2{border-color:#ff8ac4;box-shadow:0 0 18px rgba(255,138,196,.75)}
#cres{font-size:13px;color:var(--ash);text-align:center;line-height:1.85;min-height:52px}
#cres b{color:#fff;font-weight:normal}
#cres .gd{color:var(--gold)}
#chint{font-size:11px;color:#6b5f9c;transition:opacity .2s}
#chint.off{opacity:0}
#chestok{opacity:0;pointer-events:none;transition:opacity .2s}
#chestok.on{opacity:1;pointer-events:auto}
@media (max-width:820px){
  #chring{width:248px;height:248px}
  #cctrn{font-size:26px}
  .ccell .cg{font-size:19px}
  #cres{font-size:12px}
}

#testbtn{position:absolute;top:24px;right:62px;pointer-events:auto;cursor:pointer;
  width:38px;height:34px;background:rgba(20,14,45,.85);border:1px solid var(--line);
  color:var(--ash);font-family:inherit;font-size:15px;transition:.12s}
#testbtn:hover,#testbtn:focus-visible{color:var(--arc);border-color:var(--arc);outline:none}
#test{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,16,.94);z-index:7;padding:12px}
#test.on{display:flex}
.tbox{width:100%;max-width:620px;max-height:100%;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.thead .title{font-size:20px;letter-spacing:4px;color:var(--arc)}
#tglobal{display:flex;flex-wrap:wrap;gap:5px}
.tg{cursor:pointer;font-family:inherit;font-size:11px;padding:6px 9px;background:transparent;
  border:1px solid var(--line);color:var(--ash);transition:.12s}
.tg:hover{border-color:var(--arc);color:#fff}
.tg.on{border-color:var(--gold);color:var(--gold)}
#tlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:4px;padding:6px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tw{background:var(--panel);border:1px solid var(--line);padding:6px 8px}
.tw.own{border-color:var(--arc)}
.twh{display:flex;align-items:center;gap:7px}
.twh .g{font-size:16px}
.twh .n{font-size:13px;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twh .lv{font-size:11px;color:var(--gold)}
.tax{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tax span{font-size:10px;color:var(--ash);display:inline-flex;align-items:center;gap:3px;
  border:1px solid var(--line);padding:2px 4px}
.tax b{color:#fff;font-weight:normal;min-width:26px;text-align:center}
.tax button{cursor:pointer;font-family:inherit;font-size:11px;line-height:1;width:17px;height:17px;
  background:#2a2050;border:1px solid var(--line);color:#fff}
.tax button:hover{border-color:var(--arc)}

#chr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,16,.95);z-index:5;padding:14px}
#chr.on{display:flex}
#chrlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:6px;padding:8px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cw{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);padding:9px 10px}
.cw.sel{border-color:var(--arc);box-shadow:0 0 14px rgba(86,224,255,.25)}
.cw.lock{opacity:.72}
.cwg{font-size:22px;flex:0 0 30px;text-align:center}
.cwb{flex:1;min-width:0;text-align:left}
.cwn{font-size:15px;color:#fff}
.cwn span{font-size:11px;color:var(--ash);margin-left:7px}
.cwt{font-size:11px;color:var(--ash);line-height:1.55}
.cws{font-size:11px;color:var(--arc);line-height:1.55}
.cwc{font-size:10px;color:#6b5f9c;line-height:1.5}

/* ---- overlays ---- */
#veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,4,16,.9);backdrop-filter:blur(3px);text-align:center;padding:24px}
#veil.hide{display:none}
.title{font-size:44px;color:var(--gold);letter-spacing:4px;text-shadow:0 4px 0 #4a2f00}
.sub{color:var(--ash);margin-top:14px;line-height:2;font-size:15px}
.key{display:inline-block;border:1px solid var(--line);padding:1px 8px;color:#fff;background:#221846}
.btn{margin-top:26px;pointer-events:auto;cursor:pointer;border:2px solid var(--gold);background:transparent;
  color:var(--gold);font-family:inherit;font-size:19px;padding:11px 40px;letter-spacing:3px;transition:.12s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:#1a1000;outline:none}

#pick{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,4,16,.82);gap:20px}
#pick.on{display:flex}
#picktitle{font-size:30px;color:var(--arc);letter-spacing:5px;text-shadow:0 0 18px rgba(86,224,255,.6)}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{pointer-events:auto;cursor:pointer;width:210px;min-height:196px;background:var(--panel);
  border:1px solid var(--line);padding:16px 14px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:.12s}
.card .body{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;width:100%}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--arc);outline:none;
  box-shadow:0 8px 0 rgba(0,0,0,.5),0 0 22px rgba(86,224,255,.25)}
.card .glyph{font-size:34px;line-height:1}
.card .nm{font-size:19px;color:#fff}
.card .tag{font-size:11px;color:var(--ash);border:1px solid var(--line);padding:1px 8px}
.card .tx{font-size:13px;color:var(--ash);line-height:1.65}
.card .num{font-size:12px;color:var(--gold);margin-top:auto}
.card.gold{border-color:var(--gold);background:#2a1f10}
.card.gold .nm{color:var(--gold)}
.card.gold:hover{border-color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.5),0 0 30px rgba(255,204,77,.55)}
#pkbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pkb{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:13px;padding:9px 16px;
  background:transparent;border:1px solid var(--line);color:var(--ash);transition:.12s}
.pkb:hover:not(:disabled),.pkb:focus-visible:not(:disabled){border-color:var(--arc);color:#fff;outline:none}
.pkb b{color:var(--gold);font-weight:normal;margin-left:3px}
.pkb:disabled{opacity:.3;cursor:default}
.hint{font-size:12px;color:#6b5f9c}
#res{font-size:15px;color:var(--ash);line-height:2;margin-top:10px}
#res b{color:var(--gold);font-weight:normal}
#vpurse{font-size:13px;color:var(--ash);margin-top:12px}
#vpurse .sv{color:#cfd8e8}
#vpurse .gd{color:var(--gold);margin-left:12px}
.mobonly{display:none}
@media (max-width:820px){
  .deskonly{display:none}
  .mobonly{display:inline}

  #topline{top:16px;gap:14px}
  #subline{top:42px;gap:12px}
  #score{font-size:17px}
  #coins{font-size:11px}
  #timer{font-size:19px;letter-spacing:0}
  .stat{font-size:12px;padding-bottom:3px}
  #hpwrap{left:10px;bottom:10px;width:150px}
  #hpbg{height:13px}
  #hptext{font-size:11px}
  #slots{right:10px;bottom:10px;gap:4px;max-width:60%}
  .srow{gap:4px}
  .slot{width:34px;height:34px}
  .sin{inset:2.5px}
  .slot .ic{font-size:14px}
  .slot .lv{font-size:8px}
  #pausebtn{top:14px;right:10px;width:46px;height:42px;font-size:17px}
  #banner{font-size:27px;letter-spacing:5px;top:26%}

  #pick{gap:14px;padding:16px}
  #picktitle{font-size:22px;letter-spacing:3px}
  #cards{flex-direction:column;gap:9px;width:100%;max-width:420px}
  .card{width:100%;min-height:0;flex-direction:row;align-items:center;
    text-align:left;gap:12px;padding:11px 13px}

<script>
(function(){
'use strict';

var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=960,H=600,DPR=1;
function resize(){
  var r=cv.getBoundingClientRect();
  W=Math.max(260,Math.round(r.width));
  H=Math.max(320,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
}
addEventListener('resize',resize);
addEventListener('orientationchange',function(){ setTimeout(resize,150); });

/* ============ 入力 ============ */
var keys={};
var stick=null;
var STR=52;   // スティックの可動半径
addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  keys[k]=1;
  if(k===' '||k.indexOf('arrow')===0) e.preventDefault();
  if(state==='levelup'&&(k==='1'||k==='2'||k==='3')) choose(parseInt(k,10)-1);
  if(k==='p'||k==='escape') togglePause();
  if(k==='t') toggleTest();
  if(state==='chest'&&(k===' '||k==='enter')) chestSkip();
  if(state==='levelup'&&k==='r') rerollPick();
  if(state==='levelup'&&k===' ') skipPick();
});
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=0; });
cv.addEventListener('pointerdown',function(e){
  if(state!=='playing') return;
  e.preventDefault();
  var p=pt(e);
  stick={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove',function(e){
  if(!stick||e.pointerId!==stick.id) return;
  e.preventDefault();
  var p=pt(e); stick.x=p.x; stick.y=p.y;
});
function dropStick(e){ if(stick&&(!e||e.pointerId===stick.id)) stick=null; }
cv.addEventListener('pointerup',dropStick);
cv.addEventListener('pointercancel',dropStick);
cv.addEventListener('lostpointercapture',dropStick);
function pt(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

/* ============ 音 ============ */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ AC=null; } } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
function sfx(freq,dur,type,vol,slide){
  var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),a.currentTime+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(Math.max(0.00001,(vol||0.08)*VOLM*VOLS),a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur,vol){
  var a=audio(); if(!a) return;
  var n=a.sampleRate*dur, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(); s.buffer=b;
  var g=a.createGain(); g.gain.value=(vol||0.12)*VOLM*VOLS;
  s.connect(g); g.connect(a.destination); s.start();
}

/* ============ BGM（ケルト風・手続き生成）============ */
var SCALES={
  ion:[0,2,4,5,7,9,11],  // Ionian(長調)
  dor:[0,2,3,5,7,9,10],  // Dorian(ケルトの定番)
  mix:[0,2,4,5,7,9,10],  // Mixolydian(明るいが素朴)
  aeo:[0,2,3,5,7,8,10]   // Aeolian(短調)
};
function ntf(root,scale,deg){
  var s=SCALES[scale],n=s.length;
  var oct=Math.floor(deg/n), idx=((deg%n)+n)%n;
  return root*Math.pow(2,(s[idx]+12*oct)/12);
}
var bgmGain=null;
function syncBgmGain(){ if(bgmGain){ try{ bgmGain.gain.value=VOLM*VOLB; }catch(e){} } }
function bgmNote(freq,t,dur,type,vol){
  var a=AC; if(!a||!bgmGain) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.00001,vol),t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+dur+0.03);
}
function bgmPerc(t,dur,vol,lp){
  var a=AC; if(!a||!bgmGain) return;
  var n=Math.max(1,Math.floor(a.sampleRate*dur)), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(); s.buffer=b;
  var g=a.createGain(); g.gain.value=vol;
  if(lp){ var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; s.connect(f); f.connect(g); }
  else s.connect(g);
  g.connect(bgmGain); s.start(t);
}
// mel/bass: 32段(=4小節×8分)。null=休符。chords=小節ごとの和音ルート度。
var TRACKS={
  home:{ root:196,scale:'mix',bpm:76,chords:[0,3,4,3],mtype:'triangle',mvol:0.16,btype:'sine',bvol:0.14,pad:0.05,
    mel:[0,null,2,4,null,2,0,null, 4,null,2,null,0,null,-1,null, 2,null,4,5,null,4,2,null, 4,null,2,0,null,null,null,null] },
  s1:{ root:220,scale:'ion',bpm:114,chords:[0,4,5,4],mtype:'triangle',mvol:0.17,btype:'sine',bvol:0.15,pad:0.045,
    mel:[0,2,4,null,4,5,4,2, 4,null,7,null,5,4,2,null, 0,2,4,null,7,5,4,null, 5,4,2,4,0,null,null,null] },
  s1b:{ root:220,scale:'aeo',bpm:134,chords:[0,5,3,4],mtype:'sawtooth',mvol:0.13,btype:'square',bvol:0.13,pad:0.05,perc:1,
    mel:[0,null,3,null,4,3,0,null, 5,null,4,null,3,null,0,null, 3,4,5,null,4,3,null,0, 0,null,4,3,0,null,-1,null] },
  s2:{ root:174.61,scale:'dor',bpm:92,chords:[0,3,6,3],mtype:'triangle',mvol:0.15,btype:'sine',bvol:0.14,pad:0.05,
    mel:[0,null,3,null,5,3,2,null, 3,null,2,0,null,-2,null,null, 5,null,3,null,2,3,5,null, 3,2,0,null,2,null,null,null] },
  s2b:{ root:174.61,scale:'dor',bpm:126,chords:[0,6,5,3],mtype:'sawtooth',mvol:0.13,btype:'square',bvol:0.13,pad:0.05,perc:1,
    mel:[0,3,null,2,3,null,5,null, 3,null,5,7,null,5,3,null, 2,3,5,null,7,5,3,2, 3,null,2,0,null,null,null,null] }
};
var musName=null, musDef=null, musStep=0, musNextT=0, musTimer=null;
function scheduleStep(t,step,def){
  var bar=Math.floor(step/8), spb=60/def.bpm/2;
  var md=def.mel[step];
  if(md!==null&&md!==undefined) bgmNote(ntf(def.root,def.scale,md+7),t,spb*1.6,def.mtype,def.mvol);
  // ベース: 1・3拍(=step%4==0)。ボスは全拍。
  if(step%4===0||(def.perc&&step%2===0)) bgmNote(ntf(def.root,def.scale,def.chords[bar]-7),t,spb*1.7,def.btype,def.bvol);
  // パッド和音: 小節頭に3和音を長めに
  if(step%8===0){
    var r=def.chords[bar];
    bgmNote(ntf(def.root,def.scale,r),t,spb*8,'sine',def.pad);
    bgmNote(ntf(def.root,def.scale,r+2),t,spb*8,'sine',def.pad);
    bgmNote(ntf(def.root,def.scale,r+4),t,spb*8,'sine',def.pad);
  }
  if(def.perc){
    if(step%4===0) bgmPerc(t,0.12,0.10,1600);       // キック
    if(step%2===1) bgmPerc(t,0.05,0.05,7000);       // ハット
  }
}
function musicTick(){
  var a=audio(); if(!a) return;
  if(!bgmGain){ bgmGain=a.createGain(); bgmGain.gain.value=VOLM*VOLB; bgmGain.connect(a.destination); }
  if(!musName||!musDef) return;
  var spb=60/musDef.bpm/2;
  if(!musNextT) musNextT=a.currentTime+0.06;
  while(musNextT < a.currentTime+0.35){
    scheduleStep(musNextT, musStep%musDef.mel.length, musDef);
    musNextT+=spb; musStep++;
  }
}
function playBGM(name){
  if(name===musName){ syncBgmGain(); return; }
  musName=name;
  musDef=name?TRACKS[name]:null;
  musStep=0; musNextT=0;
  syncBgmGain();
  if(!musTimer){ musTimer=setInterval(musicTick,60); }
}
// 最初のユーザー操作でオーディオを解錠（ブラウザ制約）
function unlockAudio(){ audio(); musicTick(); }
window.addEventListener('pointerdown',unlockAudio);
window.addEventListener('keydown',unlockAudio);

/* ============ データ定義 ============ */
var WEAPONS={

var TMAP={};
(function(){ for(var w in WTRAIT) for(var t=0;t<3;t++) for(var i=0;i<3;i++){
  var o=WTRAIT[w][t][i]; TMAP[o.id]=o; } })();

var WX={}, SEL={}, wxRun={}, lastCd={};
var WDMG={};   // このランの武器別 与ダメージ集計
function wtier(id){ var x=WX[id]||0,n=0; for(var i=0;i<WTH.length;i++) if(x>=WTH[i]) n++; return n; }
function picksLeft(id){ return Math.max(0,wtier(id)-((SEL[id]||[]).length)); }
function anyPicks(){ for(var w in WTRAIT) if(picksLeft(w)) return 1; return 0; }
// 選択済み特性の効果を合計する
function TR(wid,key){
  var s=0, t=SEL[wid]||[];
  for(var i=0;i<t.length;i++){ var o=TMAP[t[i]]; if(o&&o.ef[key]) s+=o.ef[key]; }
  return s;
}
function TF(wid,key){ return TR(wid,key)>0; }
// 武器の系統。同系統は波及が厚くなる
var WCAT={ slash:'剣技', scythe:'剣技', chakram:'剣技', bow:'射撃', dynamite:'射撃',
           fire:'炎', flame:'炎', ice:'氷', thunder:'雷', chain:'雷',
           quake:'土', rock:'土', voidh:'闇', dhand:'闇', holy:'光', aura:'光',
           bell:'音', chainsaw:'剣技', musket:'射撃', blizzard:'氷', laser:'光', gatling:'射撃' };
var SPILL_SAME=0.10, SPILL_OTHER=0.05;
// 一度でも使った武器＝解放済みとみなす
function wOpened(id){ return ((WX[id]||0)+(wxRun[id]||0))>0; }
// 使用量に応じた熟練度。クールダウンで正規化するので連射武器が有利にならない
function wgain(id,hits){
  if(!hits||inBurst) return;
  var cd=lastCd[id]||0.5;
  var amt=cd*5*Math.min(1,0.4+hits*0.2);
  wxRun[id]=(wxRun[id]||0)+amt;
  // 解放済みの他武器へ波及させる
  for(var w in WTRAIT){
    if(w===id||!wOpened(w)) continue;
    wxRun[w]=(wxRun[w]||0)+amt*(WCAT[w]===WCAT[id]?SPILL_SAME:SPILL_OTHER);
  }
}

  return Math.min(1,0.30+0.05*lv+0.10*(P.p.affinity||0)+0.04*M('affinity')+CH().ele);
}
// 元素反応のダメージ倍率
function elemPow(){
  return 0.55+0.25*(P.p.mastery||0)+0.10*M('mastery')+CH().elp+GROW('elp');
}

/* ============ ループ ============ */
var fpsA=[], fpsI=0, perfT=0, perfEl=null, PERF=0;
function objCount(){
  return shots.length+chaks.length+scys.length+bells.length+swords.length+
         rocks.length+holes.length+zones.length+bombs.length+ebul.length+
         quakes.length+dhits.length+volley.length+lasers.length+fx.length+parts.length+relics.length;
}
function perfTick(dt){
  if(!PERF) return;
  fpsA[fpsI++%30]=dt;
  perfT-=dt;
  if(perfT>0) return;
  perfT=0.25;
  var sum=0; for(var i=0;i<fpsA.length;i++) sum+=fpsA[i];
  var fps=fpsA.length/(sum||1);
  var mn=1e9; for(var q=0;q<fpsA.length;q++) if(fpsA[q]>0) mn=Math.min(mn,1/fpsA[q]);
  var cls=fps>=55?'ok':(fps>=35?'mid':'bad');
  perfEl=perfEl||document.getElementById('perf');
  var en=0; for(var j=0;j<enemies.length;j++) if(!enemies[j].dead) en++;
  var ob=objCount();
  perfEl.innerHTML='FPS <b class="'+cls+'">'+fps.toFixed(0)+'</b> <b style="color:#6b5f9c">min '+
    (mn<1e9?mn.toFixed(0):'-')+'</b><br>'+
    '敵 <b>'+en+'</b>　判定 <b>'+ob+'</b><br>'+
    '積 <b>'+((en*ob/1000).toFixed(0))+'千</b>/フレーム';
}
var last=0;
function frame(t){
  try{
    var dt=Math.min(0.05,(t-last)/1000)||0; last=t;
    if(state==='playing') update(dt);
    else if(state==='levelup') stepFx(dt);
    else if(state==='chest'){ stepFx(dt); chestAnim(dt); }
    render();
    perfTick(dt);
  }catch(err){ if(window.console&&console.error) console.error('frame error:',err); }
  requestAnimationFrame(frame);   // 例外時も必ず次フレームを予約（追従が止まらない）
}
requestAnimationFrame(frame);

function update(dt){
  // ヒットストップ：世界は止まるが演出は動く
  if(hitStop>0){ hitStop-=dt; stepFx(dt); return; }
  time+=dt;
  whirlA+=dt*2.4;
  rtok+=dt*14; if(rtok>8) rtok=8;
  if(chainT>0){ chainT-=dt; if(chainT<=0) chain=0; }
  if(marks.length&&time>=marks[0]){
    var t=marks.shift();
    banner(t>=1740?'残り 1 分':(Math.floor(t/60)+' 分 経過'));
    flash=Math.max(flash,.3); sfx(660,.3,'triangle',.07);
  }

  movePlayer(dt);
  var rg=0.15*(META.recovery||0)+CH().regen+0.5*(P.p.heal||0);
  if(rg&&P.hp<P.max) P.hp=Math.min(P.max,P.hp+rg*dt);
  aim();
  runWeapons(dt);
  moveEnemies(dt);
  moveShots(dt);
  moveChaks(dt);
  moveScys(dt);
  moveBombs(dt);
  moveRocks(dt);
  moveHoles(dt);
  moveQuakes(dt);
  moveDhand(dt);
  moveBells(dt);
  moveSwords(dt);
  moveZones(dt);
  moveVolley(dt);
  moveLasers(dt);
  moveVacs(dt);
  vacT-=dt;
  if(vacT<=0&&vacs.length<2){ vacT=46+Math.random()*16; spawnVac(); }
  moveGems(dt);
  movePickups(dt);
  sweepDead();
  if(magFx>0) magFx-=dt;
  spawn(dt);
  swarmTick(dt);
  checkBoss();
  moveEbul(dt);
  stepFx(dt);
  syncHud();
}

function movePlayer(dt){
  var dx=0,dy=0;
  if(keys.a||keys.arrowleft) dx-=1;
  if(keys.d||keys.arrowright) dx+=1;
  if(keys.w||keys.arrowup) dy-=1;
  if(keys.s||keys.arrowdown) dy+=1;
  if(!dx&&!dy&&stick){
    var sx=stick.x-stick.ox, sy=stick.y-stick.oy, sd=Math.hypot(sx,sy);
    if(sd>9){ dx=sx/sd; dy=sy/sd; }
  }
  var d=Math.hypot(dx,dy);
  P.moving=d>0?1:0;
  if(d>0){ P.x+=dx/d*spd()*dt; P.y+=dy/d*spd()*dt; }
  if(P.hurt>0) P.hurt-=dt;
}

function nearest(x,y,range){
  var best=null,bd=range*range;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i]; if(e.dead) continue;
    var dx=e.x-x, dy=e.y-y, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}
function aim(){
  var e=nearest(P.x,P.y,900);
  if(e) P.face=Math.atan2(e.y-P.y,e.x-P.x);
}

/* ============ 武器 ============ */
var coolMax={};
function ready(id,cd,dt){
  lastCd[id]=cd;
  cool[id]=(cool[id]||0)-dt;
  if(cool[id]<=0){ cool[id]=Math.max(0.12,cd*cdr()); coolMax[id]=cool[id]; return true; }
  return false;
}
// ガトリングガン：弾倉を高速連射し、撃ち切ると長いリロード。ピーキーな超高DPS。
var gat={t:0,mag:-1,rl:0,rlmax:1};
function GATMAG(){ var m=40+AMMO('gatling')*8; return AW('gatling')?Math.round(m*1.5):m; }  // 弾数軸+8/pt、覚醒で1.5倍
function doGatling(dt){
  if(gat.mag<0) gat.mag=GATMAG();
  if(gat.rl>0){ gat.rl-=dt; return; }                    // リロード中は撃てない
  gat.t-=dt;
  if(gat.t>0) return;
  var r=RATE('gatling');
  gat.t=Math.max(0.03,0.05*r);                           // 連射間隔（rate軸で短縮）
  var e=nearest(P.x,P.y,RNG('gatling'));
  var a=e?Math.atan2(e.y-P.y,e.x-P.x):P.face;
  P.face=a;
  SRC='gatling';
  var cnt=1+CNT('gatling'), dmg=8*DMG('gatling')*pw('gatling');
  // 覚醒：左右2連バレルから同時発射
  var barrels=AW('gatling')?[-1,1]:[0];
  var perpx=-Math.sin(a), perpy=Math.cos(a);
  for(var bk=0;bk<barrels.length;bk++){
    var side=barrels[bk];
    var bx=P.x+Math.cos(a)*14+perpx*16*side, by=P.y+Math.sin(a)*14+perpy*16*side;
    for(var i=0;i<cnt;i++){
      var an=a+(Math.random()-.5)*0.10+(cnt>1?(i-(cnt-1)/2)*0.05:0);
      shots.push({x:bx,y:by,vx:Math.cos(an)*920,vy:Math.sin(an)*920,r:4,
        src:'gatling',kind:'bullet',ang:an,dmg:dmg,
        pierce:1+PRC('gatling'),life:RNG('gatling')/920,col:'#ffe27a',col2:'#a5701f',el:null,hit:[]});
    }
  }
  wgain('gatling',cnt*barrels.length); SRC=null;
  gat.mag--;
  shake=Math.min(9,shake+0.5);
  if((gat.mag&3)===0) sfx(240,.03,'square',.028,0.7);
  if(gat.mag<=0){                                         // 撃ち切り → 長リロード
    gat.rl=gat.rlmax=Math.max(2.0,4.5*r);
    gat.mag=GATMAG();
    sfx(90,.22,'sawtooth',.06,.4); noise(.12,.06);
  }
}
function runWeapons(dt){
  if(P.w.gatling) doGatling(dt);
  if(P.w.chainsaw&&ready('chainsaw',0.20*RATE('chainsaw'),dt)) doChain2();
  if(P.w.musket  &&ready('musket',  1.50*RATE('musket'),dt)){  doMusket(); queueVolley('musket',0.13); }
  if(P.w.blizzard&&ready('blizzard',0.85*RATE('blizzard'),dt)) doBlizzard();
  if(P.w.laser   &&ready('laser',   2.00*RATE('laser'),dt))    doLaser();
  if(P.w.slash&&ready('slash',0.85*RATE('slash'),dt)) doSlash();
  if(P.w.scythe  &&ready('scythe',  1.45*RATE('scythe'),dt))   doScythe();
  if(P.w.chakram &&ready('chakram', 1.65*RATE('chakram'),dt))  doChakram();
  if(P.w.bow     &&ready('bow',     0.58*RATE('bow'),dt)){     doBow(); queueVolley('bow',0.10); }
  if(P.w.dynamite&&ready('dynamite',1.85*RATE('dynamite'),dt)) doDyna();
  if(P.w.fire    &&ready('fire',    1.00*RATE('fire'),dt)){    doFire(); queueVolley('fire',0.12); }
  if(P.w.flame)  doFlame(dt);
  if(P.w.ice     &&ready('ice',     1.30*RATE('ice'),dt)){     doIce(); queueVolley('ice',0.12); }
  if(P.w.thunder &&ready('thunder', 1.65*RATE('thunder'),dt))  doThunder();
  if(P.w.chain   &&ready('chain',   1.45*RATE('chain'),dt))    doChain();
  if(P.w.quake   &&ready('quake',   2.30*RATE('quake'),dt))    doQuake();
  if(P.w.rock    &&ready('rock',    2.30*RATE('rock'),dt)){    doRock(); queueVolley('rock',0.20); }
  if(P.w.bell    &&ready('bell',    1.35*RATE('bell'),dt))     doBell();
  if(P.w.dhand   &&ready('dhand',   1.15*RATE('dhand'),dt))    doDhand();
  if(P.w.voidh   &&ready('voidh',   3.20*RATE('voidh'),dt))    doVoid();
  if(P.w.holy    &&ready('holy',    1.20*RATE('holy'),dt)){    doHoly(); queueVolley('holy',0.11); }
  if(P.w.aura    &&ready('aura',    1.60*RATE('aura'),dt))     doAura();
}
function arcHit(rad,arc,dmg,el,onHit){
  var n=0;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    var dx=e.x-P.x, dy=e.y-P.y, d=Math.hypot(dx,dy);
    if(d>rad+e.r) continue;
    if(arc<6.2){
      var a=Math.atan2(dy,dx)-P.face;
      a=Math.atan2(Math.sin(a),Math.cos(a));
      if(Math.abs(a)>arc/2) continue;
    }
    hurt(e,dmg,dx/(d||1),dy/(d||1),el);
    n++;
    if(onHit) onHit(e);
  }
  return n;
}
// チェンソー：前方を削り続ける。覚醒で全方位になる。
function doChain2(){
  SRC='chainsaw';
  var ar=AREA('chainsaw');
  var arc=AW('chainsaw')?6.3:Math.min(2.2,0.95*ar), rad=90*ar;
  var n=arcHit(rad,arc,5*DMG('chainsaw')*pw('chainsaw'),null);
  fx.push({k:'saw',x:P.x,y:P.y,a:P.face,arc:arc,rad:rad,t:0,life:.16});
  if(n) sfx(120+Math.random()*40,.05,'sawtooth',.03,1.1);
  wgain('chainsaw',n); SRC=null;
}
// マスケット：短射程の散弾
function doMusket(){
  var e=nearest(P.x,P.y,RNG('musket')); if(!e) return;
  SRC='musket';
  var a=Math.atan2(e.y-P.y,e.x-P.x);
  var cnt=5+CNT('musket')+AMMO('musket'), dmg=9*DMG('musket')*pw('musket');
  for(var i=0;i<cnt;i++){
    var an=a+(Math.random()-.5)*0.55;
    shots.push({x:P.x,y:P.y,vx:Math.cos(an)*(560+Math.random()*140),
      vy:Math.sin(an)*(560+Math.random()*140),r:5,
      src:'musket',kind:'pellet',ang:an,dmg:dmg,
      pierce:(AW('musket')?4:1)+PRC('musket'),life:0.34*RNGM('musket'),
      col:'#ffe6b0',col2:'#8a7145',el:null,hit:[]});
  }
  sfx(150,.12,'sawtooth',.075,.35); noise(.1,.07);
  shake=Math.min(10,shake+1.6);
  wgain('musket',cnt); SRC=null;
}
// アイスブリザード：自身を中心に吹雪をまとう
function doBlizzard(){
  SRC='blizzard';
  var rad=78*AREA('blizzard'), dmg=6*DMG('blizzard')*pw('blizzard');
  var sl=1.5+SLW('blizzard'), n=0;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.dead) continue;
    var dx=e.x-P.x, dy=e.y-P.y, d=Math.hypot(dx,dy);
    if(d<rad+e.r){
      e.slow=Math.max(e.slow,sl);
      if(AW('blizzard')&&Math.random()<0.06) e.frz=Math.max(e.frz||0,0.9*(1-(e.res||0)));
      hurt(e,dmg,dx/(d||1),dy/(d||1),'ice');
      n++;
    }
  }
  fx.push({k:'bliz',x:P.x,y:P.y,r:rad,t:0,life:.34});
  // 展開のたび、足元に雪の結晶が残る（歩いた跡に霜が降りるように）
  var sc=1+(Math.random()<0.5?1:0);
  for(var s2=0;s2<sc;s2++){
    var ang2=Math.random()*6.283, off=Math.random()*30;
    fx.push({k:'snowc',x:P.x+Math.cos(ang2)*off,y:P.y+P.r*0.35+Math.sin(ang2)*off*0.5,
             t:0,life:1.2,sz:6+Math.random()*5,rot:Math.random()*1.05});
  }
  wgain('blizzard',n); SRC=null;
}
// セイクリッドレーザー：自身から光の柱を放つ
var LASN=[1,2,4,6,8];
function doLaser(){
  SRC='laser';
  var c=Math.min(4,AX('laser','count')+TR('laser','count'));
  var n=LASN[c], len=420, wid=14*AREA('laser');
  var dmg=11*DMG('laser')*pw('laser'), hits=0;
  var base=P.face;
  for(var i=0;i<n;i++){
    var ang=base+i/n*6.283;
    lasers.push({x:P.x,y:P.y,a:ang,len:len,w:wid,dmg:dmg,t:0,
                 life:AW('laser')?0.85:0.22,spin:AW('laser')?1.6:0,tick:0});
    hits+=laserHit(P.x,P.y,ang,len,wid,dmg);
  }
  sfx(1480,.16,'triangle',.055,.6);
  wgain('laser',n); SRC=null;
}
function laserHit(x,y,a,len,wid,dmg){
  var cs=Math.cos(a), sn=Math.sin(a), n=0;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.dead) continue;
    var dx=e.x-x, dy=e.y-y;
    var t=dx*cs+dy*sn;                       // 光線に沿った距離
    if(t<0||t>len) continue;
    var pdist=Math.abs(-dx*sn+dy*cs);        // 光線からの垂直距離
    if(pdist<wid+e.r){ hurt(e,dmg,cs,sn,'holy'); n++; }
  }
  return n;
}
function moveLasers(dt){
  for(var i=lasers.length-1;i>=0;i--){
    var L=lasers[i];
    L.t+=dt; L.x=P.x; L.y=P.y;
    if(L.spin){
      L.a+=L.spin*dt; L.tick-=dt;
      if(L.tick<=0){ L.tick=0.2; SRC='laser'; laserHit(L.x,L.y,L.a,L.len,L.w,L.dmg*0.5); SRC=null; }
    }
    if(L.t>=L.life) lasers.splice(i,1);
  }
}
function drawLaser(L){
  var k=L.t/L.life;
  ctx.save(); ctx.translate(L.x,L.y); ctx.rotate(L.a);
  ctx.globalAlpha=(1-k)*0.35;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,-L.w*1.9,L.len,L.w*3.8);
  ctx.globalAlpha=(1-k)*0.95;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,-L.w*0.55,L.len,L.w*1.1);
  ctx.globalAlpha=1; ctx.restore();
}
function drawSaw(f){
  var k=f.t/f.life;
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.a);
  ctx.globalAlpha=.22*(1-k*0.5);
  ctx.fillStyle='#cfd8e8';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,f.rad,-f.arc/2,f.arc/2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=.9;
  ctx.strokeStyle='#f2f6ff'; ctx.lineWidth=3;
  var teeth=10;
  for(var i=0;i<teeth;i++){
    var a=-f.arc/2+f.arc*(i+((time*9)%1))/teeth;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*f.rad*0.55,Math.sin(a)*f.rad*0.55);
    ctx.lineTo(Math.cos(a)*f.rad,Math.sin(a)*f.rad);
    ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.restore();
}
function drawBliz(f){
  var k=f.t/f.life;
  ctx.save();
  ctx.globalAlpha=0.16*(1-k*0.4);
  ctx.fillStyle='#8fd8ff';
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.3); ctx.fill();
  ctx.globalAlpha=0.55*(1-k);
  ctx.strokeStyle='#dff2ff'; ctx.lineWidth=2;
  ctx.setLineDash([6,10]); ctx.lineDashOffset=-time*90;
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.3); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=0.7*(1-k);
  for(var i=0;i<7;i++){
    var a=time*2.4+i/7*6.283, r=f.r*(0.35+((i*37)%10)/16);
    ctx.fillStyle='#eafaff';
    ctx.fillRect(f.x+Math.cos(a)*r-1.5,f.y+Math.sin(a)*r-1.5,3,3);
  }
  ctx.globalAlpha=1; ctx.restore();
}
// 足元の雪の結晶（地面に残る六花）
function drawSnowC(f){
  var k=f.t/f.life, a=(k<0.25?k/0.25:1-(k-0.25)/0.75); // 出て→ゆっくり消える
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
  ctx.globalAlpha=Math.max(0,a)*0.8;
  ctx.strokeStyle='#dff2ff'; ctx.lineWidth=1.4; ctx.lineCap='round';
  for(var i=0;i<6;i++){
    ctx.rotate(Math.PI/3);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-f.sz); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-f.sz*0.55); ctx.lineTo(f.sz*0.28,-f.sz*0.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-f.sz*0.55); ctx.lineTo(-f.sz*0.28,-f.sz*0.8); ctx.stroke();
  }
  ctx.fillStyle='#eafaff'; ctx.beginPath(); ctx.arc(0,0,1.6,0,6.3); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}

function doSlash(){
  SRC='slash';
  var ar=AREA('slash');
  var arc=TF('slash','fullarc')?6.3:Math.min(3.5,1.55*ar), r2=96*ar;
  var dmg=22*DMG('slash')*pw('slash');
  var n=arcHit(r2,arc,dmg,null);
  fx.push({k:'slash',x:P.x,y:P.y,a:P.face,arc:arc,rad:r2,t:0,life:.18,col:'#dcd6ff'});
  // 覚醒「飛翔斬撃」：斬撃が飛んでいく
  if(AW('slash')){
    shots.push({x:P.x,y:P.y,vx:Math.cos(P.face)*560,vy:Math.sin(P.face)*560,r:16,
      src:'slash',kind:'wave',ang:P.face,dmg:dmg*0.85,pierce:99,life:0.85,
      col:'#e8e2ff',col2:'#9b8bff',el:null,hit:[]});
    sfx(700,.09,'sawtooth',.045,.7);
  }
  sfx(520,.06,'square',.05,.6);
  if(n){ shake=Math.min(9,shake+1.6); hitStop=Math.max(hitStop,.022); }
  wgain('slash',n); SRC=null;
}
function flameOrbs(){
  // 拡大(範囲/reach)で玉が大きくなるぶん、回転半径も少し広げて自キャラに被らないようにする
  var ar=AREA('flame'), cnt=2+CNT('flame'), rad=72*ar+9*(ar-1), out=[];
  for(var i=0;i<cnt;i++){
    var a=whirlA+i/cnt*6.283;
    out.push({x:P.x+Math.cos(a)*rad,y:P.y+Math.sin(a)*rad,a:a});
  }
  return out;
}
function doFlame(dt){
  if(!ready('flame',0.30*RATE('flame'),dt)) return;
  SRC='flame';
  var ob=flameOrbs(), dmg=7*DMG('flame')*pw('flame');
  var br=15*AREA('flame'), hits=0;
  for(var b=0;b<ob.length;b++){
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i], dx=e.x-ob[b].x, dy=e.y-ob[b].y, d=Math.hypot(dx,dy);
      if(d<e.r+br){ hurt(e,dmg,dx/(d||1),dy/(d||1),'fire'); hits++; }
    }
  }
  if(AW('flame')&&Math.random()<0.5)          // 覚醒「業火輪」
    for(var q=0;q<ob.length;q++)
      addZone(ob[q].x,ob[q].y,br*1.3,dmg*0.45,1.1,'fire',0,'#ff7a2f','flame');
  if(hits) sfx(340,.04,'sawtooth',.026,.85);
  wgain('flame',hits); SRC=null;
}
function doScythe(){
  var e=nearest(P.x,P.y,RNG('scythe'));
  var base=e?Math.atan2(e.y-P.y,e.x-P.x):P.face;

  for(var i=0;i<cnt;i++){

    b.pr=b.r;
    var ph=b.t/0.70;
    if(ph<=1) b.r=b.max*ph;
    else{ b.r=b.max*(2-ph); if(!b.back){ b.back=1; b.hit.length=0; } }
    // このフレームで輪が通過した帯だけを判定する（縁のみ・取りこぼしなし）
    var lo=b.pr-BELL_W, hi=b.r+BELL_W;
    SRC='bell';
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(e.dead||b.hit.indexOf(e)>=0) continue;
      var dx=e.x-b.x, dy=e.y-b.y, d=Math.hypot(dx,dy);
      if(d+e.r>=lo&&d-e.r<=hi){ hurt(e,b.dmg,dx/(d||1),dy/(d||1),null); b.hit.push(e); }
    }
    SRC=null;
  }
}
function drawBell(b){
  if(b.t<0) return;
  var k=Math.min(1,b.t/(AW('bell')?1.40:0.70));
  ctx.save();
  ctx.globalAlpha=(1-k)*0.50;
  ctx.strokeStyle='#cfe8ff'; ctx.lineWidth=4*(1-k)+1;
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.3); ctx.stroke();
  ctx.globalAlpha=(1-k)*0.16;
  ctx.strokeStyle='#8fd0ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.86,0,6.3); ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
}

// ダークハンド：闇の手が近くの敵を次々に突く
function doDhand(){
  var n=3+CNT('dhand'), dmg=17*DMG('dhand')*pw('dhand');
  for(var i=0;i<n;i++) dhits.push({ t:i*0.085, dmg:dmg, rad:46*(1+TR('dhand','area')) });

}
function moveDhand(dt){
  for(var i=dhits.length-1;i>=0;i--){

// ブラックホール：周囲の敵を引き寄せながら削る
function doVoid(){
  var cnt=1+CNT('voidh'), rad=88*AREA('voidh'), dmg=2.2*DMG('voidh')*pw('voidh');
  var pull=TF('voidh','pull')?230:135;
  for(var i=0;i<cnt;i++){
    var e=nearest(P.x,P.y,520);
    var a=Math.random()*6.283, r=110+Math.random()*120;
    var x=e?e.x:P.x+Math.cos(a)*r, y=e?e.y:P.y+Math.sin(a)*r;
    if(cnt>1){ x+=(Math.random()-.5)*180; y+=(Math.random()-.5)*180; }
    holes.push({x:x,y:y,r:rad,dmg:dmg,pull:pull,life:2.6,t:0,tick:0});
  }
  sfx(70,.4,'sine',.07,2.4);
  wgain('voidh',cnt*3);
}
function moveHoles(dt){
  for(var i=holes.length-1;i>=0;i--){
    var h=holes[i];
    h.life-=dt; h.t+=dt; h.tick-=dt;
    if(h.life<=0){
      if(AW('voidh')){                           // 覚醒「特異点」
        SRC='voidh';
        boom(h.x,h.y,h.r*0.9,h.dmg*32,'#c9a5ff',0);
        SRC=null;
        shake=Math.min(20,shake+8); hitStop=Math.max(hitStop,.07);
        sfx(60,.5,'sine',.09,.3); noise(.4,.12);
      }
      holes.splice(i,1); continue;
    }
    var fire=0;
    if(h.tick<=0){ h.tick=0.35; fire=1; }
    var hits=0;
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(e.dead) continue;
      var dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy)||1;
      if(d<h.r){
        var k=(1-d/h.r)*(1-(e.res||0));   // 抵抗が高い敵ほど吸い込まれない
        e.x+=dx/d*h.pull*k*dt; e.y+=dy/d*h.pull*k*dt;
        // ダメージは飾り程度。中心ほど痛く、外周ほぼゼロ（距離減衰）
        if(fire){ SRC='voidh'; hurt(e,h.dmg*(1-d/h.r),-dx/d,-dy/d,'dark'); SRC=null; hits++; }
      }
    }
  }
}

// ホーリーランス：命中すると細かく拡散する
// チャクラム：中心をキャラから距離 r に置いた円軌道を1周する。
// 円周がキャラ位置を通るので、手元から出て最大 2r まで届き、手元に戻る。
function strike(x,y,dmg,rad){
  fx.push({k:'bolt',x:x,y:y,t:0,life:.22});
  fx.push({k:'ring',x:x,y:y,r:0,to:rad,t:0,life:.25,col:'#ffe14d'});
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i], dx=e.x-x, dy=e.y-y, d=Math.hypot(dx,dy);
    if(d<rad+e.r) hurt(e,dmg,dx/(d||1),dy/(d||1),'thunder');
  }
}
function chainBolt(from,dmg){
  var pick=null,bd=170*170;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i]; if(e===from||e.dead) continue;
    var d=(e.x-from.x)*(e.x-from.x)+(e.y-from.y)*(e.y-from.y);
    if(d<bd){ bd=d; pick=e; }
  }
  if(!pick) return;
  bolts.push({x1:from.x,y1:from.y,x2:pick.x,y2:pick.y,t:0,life:.16});
  hurt(pick,dmg,0,-1,'thunder');
}
/* ============ 元素反応 ============ */
function applyElem(e,el,dmg){
  if(!el||e.dead) return;
  if(Math.random()>=elemChance(el)) return;   // 付与率の判定
  if(e.el&&e.el!==el&&e.rcd<=0&&rdep<2&&rtok>=1){
    var prev=e.el;
    rtok--; rdep++; react(e,prev,el,dmg); rdep--;
    return;
  }
  e.el=el; e.elT=4;
}
function label(e,txt,col){
  if(dmgs.length>110) dmgs.shift();
  dmgs.push({x:e.x,y:e.y-e.r-22,v:-40,t:0,life:.95,txt:txt,rx:1,col:col});
}
function boom(x,y,rad,dmg,col,slowSec){
  if(SRC){ var gb=GROW('boom'); if(gb){ dmg*=1+gb; rad*=1+gb; } }
  fx.push({k:'ring',x:x,y:y,r:0,to:rad,t:0,life:.35,col:col});
  for(var k=0;k<16;k++) parts.push({x:x,y:y,vx:(Math.random()-.5)*520,
    vy:(Math.random()-.5)*520,t:0,life:.35+Math.random()*.3,col:col,s:3+Math.random()*3});
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i], dx=e.x-x, dy=e.y-y, d=Math.hypot(dx,dy);
    if(d<rad+e.r){
      if(slowSec) e.slow=Math.max(e.slow,slowSec);
      // 距離減衰：中心で全力、外周ほど弱まる（下限40%）
      var fo=1-0.6*Math.min(1,d/(rad||1));
      hurt(e,dmg*fo,dx/(d||1),dy/(d||1),null);
    }
  }
}
function spread(from,el,dmg){
  var n=0, cap2=10+TR('aura','spread');
  for(var i=enemies.length-1;i>=0&&n<cap2;i--){
    var e=enemies[i]; if(e===from||e.dead) continue;
    var dx=e.x-from.x, dy=e.y-from.y, d=Math.hypot(dx,dy);
    if(d<155){
      bolts.push({x1:from.x,y1:from.y,x2:e.x,y2:e.y,t:0,life:.22,col:'#b8ffdd'});
      hurt(e,dmg,dx/(d||1),dy/(d||1),el);
      n++;
    }
  }
}
function dot(e,dps,sec,col){
  e.dotD=Math.max(e.dotD||0,dps); e.dotT=Math.max(e.dotT||0,sec); e.dotC=col;
}
function react(e,a,b,dmg){
  var key=[a,b].sort().join('+'), d=dmg||0, ep=elemPow();
  var keep=SRC; SRC=null;                    // 反応ダメージは武器の会心を継がない
  e.el=0; e.elT=0; e.rcd=0.55; reacts++; score+=PTS_REACT;
  if(key==='fire+thunder'){                 // 過負荷：爆発
    label(e,'過負荷','#ffb066');
    boom(e.x,e.y,115,(d*1.6+34)*ep,'#ff9040',0);
    shake=Math.min(18,shake+6); hitStop=Math.max(hitStop,.06);
    sfx(150,.24,'sawtooth',.09,.35); noise(.22,.12);
  }else if(key==='fire+ice'){               // 融解：単体特大
    label(e,'融解','#ff8080');
    fx.push({k:'ring',x:e.x,y:e.y,r:0,to:66,t:0,life:.3,col:'#ff8a8a'});
    hurt(e,(d*1.9+22)*ep,0,-1,null);
    hitStop=Math.max(hitStop,.045);
    sfx(560,.2,'sine',.075,.3);
  }else if(key==='ice+thunder'){            // 超電導：範囲＋鈍足
    label(e,'超電導','#9fe6ff');
    boom(e.x,e.y,135,(d*0.85+20)*ep,'#ffe14d',3.2);
    shake=Math.min(14,shake+3.5);
    sfx(1400,.22,'triangle',.07,.28);
  }else if(key==='dark+fire'){              // 炎症：単体に強い継続ダメージ
    label(e,'炎症','#ff9a5c');
    dot(e,(d*0.55+10)*ep,5.0,'#ff7a2f');
    fx.push({k:'ring',x:e.x,y:e.y,r:0,to:52,t:0,life:.3,col:'#ff7a2f'});
    sfx(240,.22,'sawtooth',.06,.5);
  }else if(key==='dark+ice'){               // 凍結：完全停止（抵抗で短縮）
    label(e,'凍結','#bfefff');
    e.frz=Math.max(e.frz||0,1.2*(1-(e.res||0)));
    hurt(e,(d*0.6+14)*ep,0,-1,null);
    fx.push({k:'ring',x:e.x,y:e.y,r:0,to:60,t:0,life:.35,col:'#bfefff'});
    sfx(1800,.18,'sine',.06,.4);
  }else if(key==='dark+thunder'){           // 感電：周囲へ広がる継続ダメージ
    label(e,'感電','#ffe14d');
    dot(e,(d*0.4+8)*ep,4.0,'#ffe14d');
    var n2=0;
    for(var i2=enemies.length-1;i2>=0&&n2<4;i2--){
      var o=enemies[i2];
      if(o===e||o.dead) continue;
      if(Math.hypot(o.x-e.x,o.y-e.y)<150){
        bolts.push({x1:e.x,y1:e.y,x2:o.x,y2:o.y,t:0,life:.22,col:'#ffe14d'});
        dot(o,(d*0.25+5)*ep,4.0,'#ffe14d'); n2++;
      }
    }
    sfx(1000,.2,'sawtooth',.06,.5);
  }else if(key==='dark+holy'){              // 消滅：最大HPの1%、ただし元ダメの5倍が上限
    label(e,'消滅','#d9b0ff');
    var dm=Math.min(e.mhp*0.01,d*5)*ep;
    fx.push({k:'ring',x:e.x,y:e.y,r:0,to:88,t:0,life:.4,col:'#d9b0ff'});
    hurt(e,dm,0,-1,null);
    shake=Math.min(16,shake+4); hitStop=Math.max(hitStop,.05);
    sfx(140,.3,'sine',.08,.25); noise(.2,.09);
  }else{                                    // 拡散：元素を周囲へ伝播
    var other=(a==='holy')?b:a;
    label(e,'拡散','#ffffff');
    fx.push({k:'ring',x:e.x,y:e.y,r:0,to:155,t:0,life:.32,col:'#ffffff'});
    spread(e,other,(d*0.6+14)*ep);
    sfx(880,.15,'sine',.06,1.7);
  }
  SRC=keep;
}

/* ============ 敵 ============ */
function cap(){
  var area=W*H;
  var mx=area<330000?200:(area<520000?290:380);
  return Math.min(mx,46+time*0.30);
}
function spawn(dt){
  if(time>=RUN) return;              // 30:00 以降はフェンリル戦のみ
  spawnT-=dt;
  if(spawnT<=0&&enemies.length<cap()){
    spawnT=Math.max(0.24,0.85-time*0.00051);
    var burst=1+Math.floor(time/73);
    for(var i=0;i<burst;i++) makeEnemy(rollType());
  }
  eliteT-=dt;
  if(eliteT<=0&&!boss){
    eliteT=Math.max(30,54-time*0.015);
    var k=rollType(), e=makeEnemy(k);
    e.elite=1; e.hp*=3.4; e.mhp=e.hp; e.r*=1.5; e.res=Math.max(e.res,0.55);
    flash=Math.max(flash,.3); sfx(90,.5,'sawtooth',.09,.5);
  }
}
function rollType(){
  var w=WAVE[0];
  for(var i=1;i<WAVE.length;i++) if(time>=WAVE[i].t) w=WAVE[i];
  var r=Math.random();
  for(var j=0;j<w.mix.length;j++) if(r<=w.mix[j][1]) return w.mix[j][0];
  return w.mix[w.mix.length-1][0];
}

/* ============ ボス ============ */

  if(time<BOSS_AT[bossN][0]) return;
  spawnBoss(BOSS_AT[bossN][1]);
  bossN++;
}
function spawnBoss(key){

    vx:0, vy:0, res:B.res||0.9, flat:0, split:B.split||null,

var UID=0;
function makeEnemy(k){

  var scale=1+time/60*0.63, dscale=1+time/60*0.22;
  var e={ k:k, nm:t.nm, x:P.x+Math.cos(a)*dist, y:P.y+Math.sin(a)*dist,
    hp:t.hp*scale, mhp:t.hp*scale, spd:t.spd*(0.9+Math.random()*0.25), r:t.r,
    col:t.col, dark:t.dark, xp:t.xp, dmg:t.dmg*dscale, shape:t.shape, pts:t.pts,
    ai:t.ai||'', acd:t.acd||0, at:0.6+Math.random()*1.2, st:'', stT:0,
    vx:0, vy:0, res:t.res||0, flat:(t.flat||0)*scale,
    range:t.range||0, chspd:t.chspd||0, wind:t.wind||0, chdur:t.chdur||0,
    bspd:t.bspd||0, bdmg:(t.bdmg||0)*dscale,
    boom:t.boom||0, boomR:t.boomR||0, boomDmg:(t.boomDmg||0)*dscale, life:0,
    kb:0, kbx:0, kby:0, ht:0, slow:0, el:0, elT:0, rcd:0, frz:0, dotD:0, dotT:0, dotN:0, vuln:0,
    ph:Math.random()*6.28, elite:0, boss:0, dead:0, uid:(++UID) };
  enemies.push(e); return e;
}
// 死亡した敵はフレーム末にまとめて取り除く。
// ループ中に splice すると添字がずれて enemies[j] が undefined になる。
function sweepDead(){
  for(var i=enemies.length-1;i>=0;i--) if(enemies[i].dead) enemies.splice(i,1);
}
function eshoot(e,ang,spd,dmg){
  ebul.push({x:e.x,y:e.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
             r:6,dmg:dmg,life:3.2,t:0});
}
function moveEnemies(dt){
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.dead) continue;
    var dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
    var moved=0;
    // 継続ダメージ
    if(e.dotT>0){
      e.dotT-=dt; e.hp-=e.dotD*dt;
      e.dotN=(e.dotN||0)-dt;
      if(e.dotN<=0){
        e.dotN=0.45;
        if(dmgs.length<=110) dmgs.push({x:e.x,y:e.y-e.r-4,v:-40,t:0,life:.5,
          txt:Math.round(e.dotD*0.45),crit:false,col:e.dotC,rx:1});
      }
      if(e.hp<=0){ kill(e); continue; }
    }
    // 凍結：完全に動きが止まる
    if(e.frz>0){
      e.frz-=dt;
      if(e.ht>0) e.ht-=dt;
      if(e.elT>0){ e.elT-=dt; if(e.elT<=0) e.el=0; }
      if(e.rcd>0) e.rcd-=dt;
      if(d<e.r+P.r&&P.hurt<=0&&!P.god){
        P.hp-=e.dmg*(1-0.04*M('armor'))*(1-0.03*(P.p.bulwark||0)); P.hurt=0.55; shake=Math.min(16,shake+5);
        sfx(140,.16,'square',.09,.5);
        if(P.hp<=0){ P.hp=0; die(); return; }
      }
      continue;
    }

    // 自爆クモ：プレイヤーに近づくと導火 → 起爆（倒しても kill() 側で爆発）
    if(e.boom){
      if(e.st==='fuse'){
        e.stT-=dt; moved=1;
        if(e.stT<=0){ kill(e); continue; }
      }else if(d<e.r+P.r+30){
        e.st='fuse'; e.stT=0.35; sfx(480,.1,'square',.05,1.2);
      }
    }

    if(e.ai&&e.st!=='') { /* 行動中 */ }
    else if(e.ai){ e.at-=dt; }

    // --- 固有の行動 ---
    if(e.ai==='shoot'){
      if(e.st==='wind'){
        e.stT-=dt; moved=1;                      // 立ち止まるのが予備動作
        if(e.stT<=0){ e.st=''; e.at=e.acd;
          eshoot(e,Math.atan2(dy,dx),e.bspd,e.bdmg);
          sfx(520,.07,'triangle',.035,1.4); }
      }else if(e.at<=0&&d<e.range){ e.st='wind'; e.stT=0.5; moved=1; }
    }
    else if(e.ai==='charge'){
      if(e.st==='wind'){
        e.stT-=dt; moved=1;
        if(e.stT<=0){ e.st='dash'; e.stT=e.chdur;
          e.vx=dx/d*e.chspd; e.vy=dy/d*e.chspd;
          sfx(150,.16,'sawtooth',.05,.6); }
      }else if(e.st==='dash'){
        e.stT-=dt; moved=1;
        e.x+=e.vx*dt; e.y+=e.vy*dt;
        if(Math.random()<0.5) parts.push({x:e.x,y:e.y+e.r*0.5,vx:(Math.random()-.5)*70,
          vy:-Math.random()*40,t:0,life:.3,col:'#a08a6a',s:3});
        if(e.stT<=0){ e.st=''; e.at=e.acd; }
      }else if(e.at<=0&&d<e.range){ e.st='wind'; e.stT=e.wind; moved=1; }
    }
    else if(e.ai==='fly'){
      if(!e.vx&&!e.vy){ e.vx=dx/d*e.spd; e.vy=dy/d*e.spd; }
      e.x+=e.vx*dt; e.y+=e.vy*dt; moved=1;
      if(d>640){ e.vx=dx/d*e.spd; e.vy=dy/d*e.spd; }   // 遠ざかったら旋回して戻る
    }
    else if(e.ai==='slam'){
      if(e.st==='wind'){
        e.stT-=dt; moved=1;
        if(e.stT<=0){
          e.st=''; e.at=e.acd;
          for(var b=0;b<e.nbul;b++) eshoot(e,b/e.nbul*6.283+Math.random()*0.2,e.bspd,e.bdmg);
          fx.push({k:'ring',x:e.x,y:e.y,r:0,to:120,t:0,life:.35,col:'#ffd08a'});
          shake=Math.min(18,shake+6); sfx(90,.26,'square',.09,.4); noise(.2,.11);
        }
      }else if(e.at<=0&&d<520){ e.st='wind'; e.stT=e.wind; moved=1; }
    }
    else if(e.ai==='summon'){
      if(e.at<=0){
        e.at=e.acd;
        for(var m=0;m<e.nsum;m++){
          var an=Math.random()*6.283, o=makeEnemy(e.sum);
          o.x=e.x+Math.cos(an)*(e.r+34); o.y=e.y+Math.sin(an)*(e.r+34);
        }
        fx.push({k:'ring',x:e.x,y:e.y,r:0,to:90,t:0,life:.3,col:'#a8e06a'});
        sfx(300,.2,'square',.06,1.8);
      }
    }
    else if(e.ai==='howl'){
      if(e.at<=0){
        e.at=e.acd;
        for(var m2=0;m2<e.nsum;m2++){
          var an2=Math.random()*6.283, o2=makeEnemy(e.sum);
          o2.x=e.x+Math.cos(an2)*(e.r+40); o2.y=e.y+Math.sin(an2)*(e.r+40);
          o2.spd*=1.35;
        }
        for(var j2=0;j2<enemies.length;j2++){
          var w2=enemies[j2];
          if(!w2.dead&&w2.k==='wolf'&&!w2.boss&&!w2.buffed){ w2.buffed=1; w2.spd*=1.3; }
        }
        fx.push({k:'ring',x:e.x,y:e.y,r:0,to:300,t:0,life:.5,col:'#cfe0ff'});
        shake=Math.min(16,shake+5);
        sfx(180,.5,'sawtooth',.09,.4); noise(.4,.09);
      }
    }
    else if(e.ai==='dash'){
      // スウォーム：出現時に決めた方向へ直進。追尾せず画面外で消滅。
      e.x+=e.vx*dt; e.y+=e.vy*dt; moved=1;
      if(e.life>0){ e.life-=dt; if(e.life<=0){ e.dead=1; continue; } }
      if(d>1500){ e.dead=1; continue; }
    }

    // --- 移動 ---
    if(e.kb>0){
      var kr=1-(e.res||0);
      e.x+=e.kbx*e.kb*dt*13*kr; e.y+=e.kby*e.kb*dt*13*kr; e.kb-=dt*38;
    }else if(!moved){
      var sp=e.slow>0?e.spd*0.45:e.spd;
      e.x+=dx/d*sp*dt; e.y+=dy/d*sp*dt;
    }
    if(e.ht>0) e.ht-=dt;
    if(e.slow>0) e.slow-=dt;
    if(e.elT>0){ e.elT-=dt; if(e.elT<=0) e.el=0; }
    if(e.rcd>0) e.rcd-=dt;
    if(e.vuln>0) e.vuln-=dt;

    // --- プレイヤーへの接触 ---
    if(d<e.r+P.r&&P.hurt<=0&&!P.god){
      P.hp-=e.dmg*(1-0.04*M('armor'))*(1-0.03*(P.p.bulwark||0)); P.hurt=0.55; shake=Math.min(16,shake+5);
      sfx(140,.16,'square',.09,.5);
      if(P.hp<=0){ P.hp=0; die(); return; }
    }
    // --- 敵同士の押し出し ---
    if(!e.boss){
      for(var j=i-1;j>=0&&j>i-14;j--){
        var o=enemies[j];
        if(o.dead||o.boss) continue;
        var ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy);
        var mn=e.r+o.r;
        if(od>0&&od<mn){
          var push=(mn-od)/od*0.5;
          e.x+=ox*push; e.y+=oy*push; o.x-=ox*push; o.y-=oy*push;
        }
      }
    }
  }
}
function moveEbul(dt){
  var arm=(1-0.04*M('armor'))*(1-0.03*(P.p.bulwark||0));
  for(var i=ebul.length-1;i>=0;i--){
    var b=ebul[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; b.t+=dt;
    if(b.life<=0){ ebul.splice(i,1); continue; }
    if(P.hurt<=0&&!P.god&&Math.hypot(P.x-b.x,P.y-b.y)<P.r+b.r){
      P.hp-=b.dmg*arm; P.hurt=0.55; shake=Math.min(16,shake+5);
      sfx(160,.15,'square',.085,.5);

      if(P.hp<=0){ P.hp=0; die(); return; }

}
function hurt(e,dmg,nx,ny,el){
  if(e.dead) return;
  var crit=Math.random()<CRITC();
  var d=crit?dmg*CRITD():dmg;
  if(P.nodmg) d=0;                         // テスト：判定は走るが敵は死なない
  if(e.vuln>0) d*=1.2;                     // 深淵の手：被ダメージ上昇
  if(e.flat) d=Math.max(d*0.25,d-e.flat);   // 甲羅：軽い攻撃ほど通らない
  e.hp-=d; e.ht=0.12; e.kb=Math.max(e.kb,crit?4:2.2); e.kbx=nx||0; e.kby=ny||0;
  if(SRC) WDMG[SRC]=(WDMG[SRC]||0)+d; else WDMG._react=(WDMG._react||0)+d;   // 与ダメージ集計
  if(dmgs.length>110) dmgs.shift();
  dmgs.push({x:e.x,y:e.y-e.r-4,v:-52,t:0,life:.65,txt:Math.round(d),crit:crit});
  if(el) applyElem(e,el,d);
  if(e.hp<=0) kill(e);
}
function kill(e){
  if(e.dead) return;
  e.dead=1; kills++;
  score+=e.boss?e.pts:(e.elite?PTS_ELITE:e.pts);
  var np=e.boss?60:(e.elite?26:7);
  for(var k=0;k<np;k++){

      vy:(Math.random()-.5)*(e.boss?520:260),
      t:0,life:.4+Math.random()*.4,col:e.col,s:2+Math.random()*3});
  }
  var n=e.boss?8:(e.elite?6:1);
  // ボスの e.xp は「合計値」。粒に割って落とす。
  var val=e.boss?Math.max(1,Math.round(e.xp/n)):
          (e.elite?Math.max(4,Math.round((24+time*0.33)/6)):e.xp);
  for(var g=0;g<n;g++){
    gems.push({x:e.x+(Math.random()-.5)*40,y:e.y+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,val:val,pull:0,sp:0});
  }
  if(e.boss){
    // 分裂するボスは死に際に子を残す
    if(e.split){
      for(var i2=0;i2<e.split.n;i2++){
        var an=i2/e.split.n*6.283, o=makeEnemy(e.split.k);
        o.x=e.x+Math.cos(an)*(e.r*0.7); o.y=e.y+Math.sin(an)*(e.r*0.7);
        o.split2=1;
      }
    }
    chests.push({x:e.x,y:e.y,t:0,boss:1});
    flash=1; shake=24; hitStop=Math.max(hitStop,.28);
    sfx(1046,.5,'triangle',.09);
    setTimeout(function(){ sfx(1568,.5,'triangle',.085); },170);
    if(boss===e) boss=null;
    if(!e.last) playBGM('s'+curStage);
    if(e.last){ setTimeout(function(){ finish(true); },700); }
  }else{
    // 中スライムはさらに小スライムへ
    if(e.split2){
      for(var i3=0;i3<2;i3++){
        var an3=Math.random()*6.283, o3=makeEnemy('slimeS');
        o3.x=e.x+Math.cos(an3)*18; o3.y=e.y+Math.sin(an3)*18;
      }
    }
    if(e.elite){
      chests.push({x:e.x,y:e.y,t:0});
      flash=Math.max(flash,.45); shake=Math.min(20,shake+9); hitStop=Math.max(hitStop,.09);
    }else if(Math.random()<(ETYPE[e.k].sv||0)*(1+0.15*M('luck')+0.10*(P.p.greed||0))){
      coins.push({x:e.x,y:e.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,pull:0,sp:0});
    }
  }
  if(e.boom&&!e.bshown){ e.bshown=1; spiderBoom(e); }
  chain++; chainT=1.4;
  var step=Math.min(chain,20);
  sfx(196*Math.pow(2,step/12),.055,'square',.045);
}

// スウォーム：画面外の一辺から20〜30体が出現し、出現時のプレイヤー位置へ突進して通り抜ける

/* ============ 弾・宝石 ============ */
function moveShots(dt){
  for(var i=shots.length-1;i>=0;i--){
    var s=shots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    parts.push({x:s.x,y:s.y,vx:0,vy:0,t:0,life:.22,col:s.col,s:3});
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(s.hit.indexOf(e)>=0) continue;
      if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+s.r){
        var d=Math.hypot(s.vx,s.vy)||1;
        SRC=s.src;
        hurt(e,s.dmg,s.vx/d,s.vy/d,s.el);
        SRC=null;
        if(s.slow) e.slow=Math.max(e.slow,s.slow);
        if(s.src==='ice'&&AW('ice')) addZone(e.x,e.y,44,s.dmg*0.18,3.0,'ice',1.6,'#7fd8ff','ice');
        s.hit.push(e); s.pierce--;
        if(s.split) { holySplit(s); s.split=0; }
        if(s.src==='fire'&&s.boom) fireBoom(s);  // 敵に当たるたび爆発
        if(s.grow&&s.dmg<s.base*3) s.dmg*=1.35;
        if(s.pierce<=0){ s.life=0; break; }
      }
    }
    if(s.life<=0) shots.splice(i,1);
  }
}
function fireBoom(s){
  SRC='fire';

  var r=s.boom, dm=s.dmg*0.5;

// 地面に残る効果（亀裂・氷柱・炎の帯）をまとめて扱う
function addZone(x,y,r,dmg,life,el,slow,col,src){
  if(zones.length>40) zones.shift();
  zones.push({x:x,y:y,r:r,dmg:dmg,life:life,t:0,ti:0,el:el||null,
              slow:slow||0,col:col||'#8f7a58',src:src||null});

function moveZones(dt){
  for(var i=zones.length-1;i>=0;i--){

function drawZone(z){

function moveGems(dt){

function movePickups(dt){

// 開始時に4個配置。原点から450〜1000px、互いに300px以上、中身は重複なし4種。
function placeRelics(){
  for(var attempt=0;attempt<50;attempt++){
    var keys=Object.keys(PASSIVES); shuffle(keys);
    var pick=keys.slice(0,4), out=[], failed=0;
    for(var i=0;i<pick.length;i++){
      var placed=0;
      for(var tries=0;tries<300;tries++){
        var a=Math.random()*6.283, d=800+Math.random()*800;   // 原点から800〜1600px（遠め）
        var x=Math.cos(a)*d, y=Math.sin(a)*d, ok=1;
        for(var j=0;j<out.length;j++) if(Math.hypot(x-out[j].x,y-out[j].y)<400){ ok=0; break; }
        if(ok){ out.push({x:x,y:y,id:pick[i],t:Math.random()*6.28}); placed=1; break; }
      }
      if(!placed){ failed=1; break; }
    }
    if(!failed) return out;
  }
  return out;
}
// 取得：6枠を無視して対象パッシブ+1。床装備はレベル上限を1だけ超えられる（例：パッシブ5＋装備1＝6）。
// それも超える（すでに max+1）なら銀貨+15に変換。
function takeRelic(rl){
  var id=rl.id, p=PASSIVES[id], cur=P.p[id]||0, txt;
  if(cur>=p.max+1){
    silver+=15; score+=15; txt='銀貨 +15';
  }else{
    P.p[id]=cur+1;
    P.rel[id]=(P.rel[id]||0)+1;         // 床装備由来のレベルを別勘定（表示の「装備」段に使う）
    if(id==='vital'){ P.max+=30; P.hp=Math.min(P.max,P.hp+30); }
    if(id==='magnet') magFx=1.6;
    txt=p.nm+' Lv'+(cur+1);
  }

  dmgs.push({x:rl.x,y:rl.y-30,v:-40,t:0,life:.95,txt:txt,rx:1,col:'#7fe6ff'});

/* ============ 宝箱 ============ */
// 候補は「所持している武器の、まだ伸ばせる軸」だけ。新しい武器は絶対に出ない。
function chestPool(){
  var pool=[], id;
  for(id in P.w){
    if((P.w[id]||0)>=WEAPONS[id].max) continue;
    for(var ax in WAX[id]) if(axLeft(id,ax)>0) pool.push({id:id,ax:ax});
  }
  if(!pool.length)
    for(id in P.w) for(var k in LBN) if(lbOK(id,k)) pool.push({id:id,ax:k,lb:1});
  return pool;
}
var CELLS=12;
var chCands=[], chItems=[], chGold=0, chSilver=0, chHeal=0;
var chMarks=[], chCells=[], chMarkEls=[], chEl=null, chRing=null, chReady=0, chDone=0;

function openChest(ch){
  var isB=!!ch.boss, r=Math.random();
  var lk=0.05*(P.p.fortune||0);                 // 幸運：当たり枠が増えやすい
  var n = isB ? (r<0.30+lk?3:(r<0.75+lk?2:1))
              : (r<0.05+lk?3:(r<0.20+lk?2:1));
  var pool=chestPool();
  n=Math.min(n,pool.length);
  var hit=isB||Math.random()<0.50;
  chGold = hit?(1+Math.floor(time/800))*(isB?2:1):0;
  chSilver = hit?0:3;
  chHeal=0;
  if(P.hp<P.max){ chHeal=Math.round(P.max*0.25); P.hp=Math.min(P.max,P.hp+chHeal); }
  if(!n){ chGold+=4; chItems=[]; }              // 伸ばせる軸が無ければ金貨のみ
  flash=Math.max(flash,.5); shake=Math.min(20,shake+7);
  startRoulette(n,pool);
}
function startRoulette(n,pool){
  state='chest';
  keys={}; stick=null;
  chEl=chEl||document.getElementById('chest');
  chRing=chRing||document.getElementById('chring');

  // 盤面の候補を作る（多ければ重複なし、少なければ繰り返して埋める）
  chCands=[];
  if(pool.length>=CELLS){
    var sh=pool.slice(); shuffle(sh);
    chCands=sh.slice(0,CELLS);
  }else{
    for(var i=0;i<CELLS;i++) chCands.push(pool.length?pool[i%pool.length]:null);
    shuffle(chCands);
  }

  // 当たりのマスを重複なしで決める
  var targets=[], used={};
  for(var k=0;k<n;k++){
    var t, guard=0;
    do{ t=Math.floor(Math.random()*CELLS); guard++; }while(used[t]&&guard<60);
    used[t]=1; targets.push(t);
  }
  chItems=targets.map(function(t){ return chCands[t]; });

  chMarks=[]; chDone=0; chReady=0;
  for(var m=0;m<n;m++){
    var st=Math.floor(Math.random()*CELLS);
    chMarks.push({ s:st, tg:targets[m], laps:2+m, dur:1.9+m*0.65, t:0, done:0 });
  }
  buildBoard();          // chMarks を決めてから盤面とカーソルを生成する
  document.getElementById('cctrn').textContent=n||'—';
  document.getElementById('cctrl').textContent=n>1?'ITEMS':'ITEM';
  document.getElementById('cres').innerHTML='';
  document.getElementById('chestok').classList.remove('on');
  document.getElementById('chint').classList.remove('off');
  chEl.classList.add('on');
  updateMarks();
  sfx(660,.09,'square',.05,1.6);
  if(!n) revealChest();
}
// 4×4の外周12マス。中央2×2は空けて枚数を表示する。
function cellRC(i){
  var order=[[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3],[3,2],[3,1],[3,0],[2,0],[1,0]];
  return order[((i%CELLS)+CELLS)%CELLS];
}
function buildBoard(){
  Array.prototype.forEach.call(chRing.querySelectorAll('.ccell,.cmark'),function(x){ x.remove(); });
  var W2=chRing.clientWidth||284;
  var gap=Math.round(W2*0.022), cell=Math.floor((W2-gap*3)/4), stp=cell+gap;
  chCells=[];
  for(var i=0;i<CELLS;i++){
    var rc=cellRC(i), c=document.createElement('div');
    c.className='ccell';
    c.style.width=cell+'px'; c.style.height=cell+'px';
    c.style.left=(rc[1]*stp)+'px'; c.style.top=(rc[0]*stp)+'px';
    var it=chCands[i];
    c.innerHTML=it?('<div class="cg">'+WEAPONS[it.id].glyph+'</div><div class="cn">'+AXN[it.ax]+'</div>')
                  :'<div class="cg">🪙</div><div class="cn">金貨</div>';
    chRing.appendChild(c); chCells.push(c);
  }
  var ct=document.getElementById('cctr');
  ct.style.left=stp+'px'; ct.style.top=stp+'px';
  ct.style.width=(cell*2+gap)+'px'; ct.style.height=(cell*2+gap)+'px';
  chMarkEls=[];
  for(var m=0;m<chMarks.length;m++){
    var k=document.createElement('div');
    k.className='cmark'+(m?' m'+m:'');
    k.style.width=cell+'px'; k.style.height=cell+'px';
    chRing.appendChild(k); chMarkEls.push(k);
  }
  chRing._cell=cell; chRing._stp=stp;
}
function markPos(m){
  if(m.done) return m.tg;
  var x=Math.min(1,m.t/m.dur), e=1-Math.pow(1-x,3);      // 減速して着地
  var span=m.laps*CELLS+(((m.tg-m.s)%CELLS)+CELLS)%CELLS;
  return m.s+span*e;
}
function updateMarks(){
  var stp=chRing._stp||70;
  for(var i=0;i<chMarks.length;i++){
    var idx=Math.round(markPos(chMarks[i]))%CELLS;
    var rc=cellRC(idx);
    if(chMarkEls[i]){
      chMarkEls[i].style.left=(rc[1]*stp)+'px';
      chMarkEls[i].style.top=(rc[0]*stp)+'px';
    }
  }
}
var chTick=0;
function chestSkip(){
  if(state!=='chest') return;
  if(!chDone){
    for(var i=0;i<chMarks.length;i++){ chMarks[i].done=1; chMarks[i].t=chMarks[i].dur; }
    updateMarks(); revealChest(); return;
  }
  if(chReady<=0) closeChest();
}
function chestAnim(dt){
  if(chReady>0) chReady-=dt;
  if(chDone) return;
  var all=1;
  for(var i=0;i<chMarks.length;i++){
    var m=chMarks[i];
    if(m.done) continue;
    var before=Math.round(markPos(m))%CELLS;
    m.t+=dt;
    if(m.t>=m.dur){ m.t=m.dur; m.done=1; sfx(1046,.14,'triangle',.07); }
    else{
      all=0;
      var after=Math.round(markPos(m))%CELLS;
      if(after!==before) sfx(1200,.02,'square',.022);
    }
  }
  updateMarks();
  if(all) revealChest();
}
function revealChest(){
  if(chDone) return;
  chDone=1;
  var win={};
  for(var i=0;i<chMarks.length;i++) win[chMarks[i].tg]=1;
  for(var c=0;c<chCells.length;c++)
    chCells[c].classList.add(win[c]?'win':'dim');
  var lines=[];
  for(var k=0;k<chItems.length;k++){
    var it=chItems[k];
    if(it) lines.push('<b>'+WEAPONS[it.id].nm+'</b> の '+AXN[it.ax]+' +1');
  }
  if(chGold) lines.push('<span class="gd">金貨 +'+chGold+'</span>');
  if(chSilver) lines.push('銀貨 +'+chSilver);
  if(chHeal) lines.push('<span style="color:#7bff9d">HP +'+chHeal+'</span>');
  document.getElementById('cres').innerHTML=lines.join('<br>');
  document.getElementById('chestok').classList.add('on');
  document.getElementById('chint').classList.add('off');
  chReady=0.35;
  [0,90,180].forEach(function(ms,i){ setTimeout(function(){ sfx([784,988,1319][i],.16,'triangle',.075); },ms); });
}
function closeChest(){
  if(state!=='chest') return;      // 二重適用を防ぐ
  for(var i=0;i<chItems.length;i++){
    var it=chItems[i];
    if(!it) continue;
    if(it.lb){
      if(!P.lb[it.id]) P.lb[it.id]={};
      P.lb[it.id][it.ax]=(P.lb[it.id][it.ax]||0)+1;
      continue;
    }
    addWLv(it.id,it.ax);
  }
  gold+=chGold; silver+=chSilver;
  score+=chGold*300+chSilver*15+chItems.length*400;
  chEl.classList.remove('on');
  state='playing'; last=performance.now();
  syncHud();
}

function gainXp(v){
  P.xp+=v*(1+GROW('xp'))*(1+0.08*(P.p.exp||0));   // 経験値取得（キャラ成長＋パッシブ）
  sfx(1180,.03,'sine',.028);
  var got=0;
  while(P.xp>=P.need){
    P.xp-=P.need; P.lv++; P.need=xpNeed(P.lv); pending++; got++;
    if(got>40) break;
  }
  if(got&&state==='playing') openLevelUp();
}

/* ============ レベルアップ ============ */
function openLevelUp(){
  var fresh=(state!=='levelup');
  state='levelup';
  if(fresh){
    flash=Math.max(flash,.5);
    [0,90,170].forEach(function(ms,i){ setTimeout(function(){ sfx([523,659,880][i],.16,'triangle',.07); },ms); });
  }
  document.getElementById('picktitle').textContent='LEVEL UP'+(pending>1?'  ×'+pending:'');
  choices=rollChoices();

      '<div class="body">'+
        '<div class="nm">'+c.nm+'</div>'+
        '<div class="tag">'+c.tag+'</div>'+
        '<div class="tx">'+c.tx+'</div>'+
        '<div class="num">'+c.lvtx+'</div>'+
      '</div>';
    d.onclick=function(){ choose(i); };

function rerollPick(){

function skipPick(){
  if(state!=='levelup'||P.sk<=0) return;
