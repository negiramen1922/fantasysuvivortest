function rollChoices(){
  var pool=[], id;
  var slots=0;
  for(id in P.w) slots++;

  for(id in WEAPONS){
    var W_=WEAPONS[id];
    var lv=P.w[id]||0;
    if(lv===0){
      // 未所持：新規取得のカード
      if(BAN[id]) continue;                     // 排他でBANされた武器は出さない
      if(slots>=6) continue;
      var CATLBL={melee:'近接',mid:'中射程',long:'長射程'};
      var rc=CATLBL[WCLASS[id]]?('　［'+CATLBL[WCLASS[id]]+'］'):'';
      pool.push({id:id,kind:'new',nm:W_.nm,glyph:W_.glyph,tag:W_.tag,tx:W_.tx+rc,lvtx:'NEW'});
      continue;
    }
    if(lv>=W_.max) continue;
    // 所持済み：伸ばせる軸ごとに1枚ずつ候補を作る
    for(var ax in WAX[id]){
      if(axLeft(id,ax)<=0) continue;
      pool.push({id:id,kind:'ax',ax:ax,nm:W_.nm+' ・ '+AXN[ax],glyph:W_.glyph,
        tag:W_.tag,tx:AXT[ax],
        lvtx:(lv+1>=10&&AWK[id]&&!AW(id)?'★ 覚醒：'+AWK[id]:
              'Lv '+lv+' → '+(lv+1)+'　'+AXN[ax]+' '+AX(id,ax)+'/'+WAX[id][ax]),
        gold:(lv+1>=10&&AWK[id]&&!AW(id))?1:0});
    }
  }
  // 枠・上限はレベルアップ由来ぶんだけで数える（床装備由来は別勘定＝6枠と上限5を圧迫しない）
  var pslots=0;
  for(id in P.p) if(((P.p[id]||0)-(P.rel[id]||0))>0) pslots++;
  for(id in PASSIVES){
    var p=PASSIVES[id], tot=P.p[id]||0, lvup=tot-(P.rel[id]||0);
    if(lvup>=p.max) continue;
    if(lvup===0&&pslots>=6) continue;          // パッシブも6枠まで（レベルアップ由来のみ）
    pool.push({id:id,kind:'p',nm:p.nm,glyph:p.glyph,tag:p.tag,tx:p.tx,
      lvtx:tot===0?'NEW':('Lv '+tot+' → '+(tot+1))});
  }
  // 通常の強化先が尽きたら限界突破に切り替わる
  if(!pool.length) pool=lbPool();
  shuffle(pool);
  // 同じ武器の軸が3枚とも並ぶと選択が窮屈なので、同一武器は最大2枚まで
  var out=[], seen={};
  for(var i=0;i<pool.length&&out.length<3;i++){
    var c=pool[i], k=c.kind==='p'?('p'+c.id):c.id;
    if((seen[k]||0)>=2) continue;
    seen[k]=(seen[k]||0)+1;
    out.push(c);
  }
  if(!out.length) out=[{id:'heal',kind:'heal',nm:'祝福',glyph:'✚',tag:'回復',tx:'HPを全快させる。',lvtx:'—'}];
  return out;
}
// 限界突破の候補（所持武器 × 伸ばせるステータス）
function lbPool(){
  var out=[], id;
  for(id in P.w){
    for(var k in LBN){
      if(!lbOK(id,k)) continue;
      out.push({id:id,kind:'lb',ax:k,gold:1,
        nm:WEAPONS[id].nm+' ・ 限界突破',glyph:WEAPONS[id].glyph,tag:'限界突破',
        tx:LBT[k],lvtx:LBN[k]+'  +'+LB(id,k)+(LBCAP[k]?' / '+LBCAP[k]:'')});
    }
  }
  return out;
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } }

function choose(i){
  if(state!=='levelup') return;
  var c=choices[i]; if(!c) return;
  if(c.kind==='new'){
    P.w[c.id]=1; P.wa[c.id]={};
  }else if(c.kind==='lb'){
    if(!P.lb[c.id]) P.lb[c.id]={};
    P.lb[c.id][c.ax]=(P.lb[c.id][c.ax]||0)+1;
  }else if(c.kind==='ax'){
    addWLv(c.id,c.ax);
  }else if(c.kind==='p'){
    P.p[c.id]=(P.p[c.id]||0)+1;
    if(c.id==='vital'){ P.max+=30; P.hp=Math.min(P.max,P.hp+30); }
    if(c.id==='magnet') magFx=1.6;
  }else if(c.kind==='heal'){ P.hp=P.max; }
  document.getElementById('pick').classList.remove('on');
  pending--;
  syncHud();
  if(pending>0){ openLevelUp(); return; }
  pending=0;
  state='playing';
}

/* ============ 演出 ============ */
function stepFx(dt){
  var i;
  for(i=fx.length-1;i>=0;i--){ fx[i].t+=dt; if(fx[i].t>=fx[i].life) fx.splice(i,1); }
  for(i=bolts.length-1;i>=0;i--){ bolts[i].t+=dt; if(bolts[i].t>=bolts[i].life) bolts.splice(i,1); }
  for(i=dmgs.length-1;i>=0;i--){ var d=dmgs[i]; d.t+=dt; d.y+=d.v*dt; d.v+=170*dt; if(d.t>=d.life) dmgs.splice(i,1); }
  for(i=parts.length-1;i>=0;i--){ var p=parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.9; p.vy*=0.9; if(p.t>=p.life) parts.splice(i,1); }
  shake*=Math.pow(0.02,dt); if(shake<0.2) shake=0;
  if(flash>0) flash-=dt*2.4;
}

/* ============ 描画 ============ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=curGround.bg; ctx.fillRect(0,0,W,H);
  if(state==='title'){ return; }

  var sh=(state==='paused'||state==='chest'||state==='test')?0:shake*SHK;
  var sx=(Math.random()-.5)*sh, sy=(Math.random()-.5)*sh;
  var camx=P.x-W/2-sx, camy=P.y-H/2-sy;
  ctx.save(); ctx.translate(-camx,-camy);

  drawGround(camx,camy);
  var i,f;

  // ---- 地面の層：広い面の演出はすべて敵より下に描く ----
  drawMagRing();
  for(i=0;i<relics.length;i++) drawRelic(relics[i]);
  for(i=0;i<chests.length;i++) drawChest(chests[i]);
  for(i=0;i<coins.length;i++) drawCoin(coins[i]);
  for(i=0;i<vacs.length;i++) drawVac(vacs[i]);
  for(i=0;i<gems.length;i++) drawGem(gems[i]);
  for(i=0;i<zones.length;i++) drawZone(zones[i]);
  for(i=0;i<holes.length;i++) drawHole(holes[i]);
  for(i=0;i<swords.length;i++) drawSwordZone(swords[i]);
  for(i=0;i<bells.length;i++) drawBell(bells[i]);
  for(i=0;i<chaks.length;i++) drawChakGuide(chaks[i]);
  for(i=0;i<fx.length;i++){ f=fx[i];
    if(f.k==='ring') drawRing(f);
    else if(f.k==='quake') drawQuake(f);
    else if(f.k==='snowc') drawSnowC(f);
    else if(f.k==='aura') drawAura(f); }

  // ---- 敵と自機 ----
  for(i=0;i<enemies.length;i++) if(!enemies[i].dead) drawEnemy(enemies[i]);
  for(i=0;i<rocks.length;i++) drawRock(rocks[i]);
  drawPlayer();
  // ガトリング：リロード中はプレイヤー周囲に進捗リングを表示
  if(P.w&&P.w.gatling&&gat.rl>0){
    var grk=1-gat.rl/(gat.rlmax||1);
    ctx.save(); ctx.translate(P.x,P.y);
    ctx.strokeStyle='rgba(255,70,70,.35)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,P.r+11,0,6.3); ctx.stroke();
    ctx.strokeStyle='#ffd24d'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,P.r+11,-Math.PI/2,-Math.PI/2+6.283*grk); ctx.stroke();
    ctx.fillStyle='#ffd24d'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('RELOAD',0,-P.r-18);
    ctx.restore();
  }

  // ---- 前景：実体のあるものだけを敵より上に描く ----
  for(i=0;i<shots.length;i++) drawShot(shots[i]);
  for(i=0;i<ebul.length;i++) drawEbul(ebul[i]);
  for(i=0;i<lasers.length;i++) drawLaser(lasers[i]);
  for(i=0;i<chaks.length;i++) drawChak(chaks[i]);
  for(i=0;i<scys.length;i++) drawScy(scys[i]);
  for(i=0;i<bombs.length;i++) drawBomb(bombs[i]);
  for(i=0;i<swords.length;i++) drawSword(swords[i]);
  if(P.w.flame) drawFlame(P.w.flame);
  for(i=0;i<parts.length;i++){ var p=parts[i];
    ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.globalAlpha=1;
  for(i=0;i<fx.length;i++){ f=fx[i];
    if(f.k==='slash') drawSlash(f);
    else if(f.k==='bolt') drawBolt(f);
    else if(f.k==='saw') drawSaw(f);
    else if(f.k==='bliz') drawBliz(f);
    else if(f.k==='hand') drawHand(f);
    else if(f.k==='pillar') drawPillar(f); }
  for(i=0;i<bolts.length;i++) drawChain(bolts[i]);
  drawEnemyOutlines();
  for(i=0;i<dmgs.length;i++) drawDmg(dmgs[i]);

  ctx.restore();

  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+Math.min(.75,flash*.7)+')'; ctx.fillRect(0,0,W,H); }
  if(P&&P.hurt>0.3){ ctx.fillStyle='rgba(255,40,80,'+(P.hurt-0.3)*0.5+')'; ctx.fillRect(0,0,W,H); }
  drawRelicMarkers();
  if(stick&&state==='playing') drawStick();
}
function drawStick(){
  var dx=stick.x-stick.ox, dy=stick.y-stick.oy, d=Math.hypot(dx,dy)||1;
  var k=Math.min(1,d/STR);
  ctx.save();
  ctx.globalAlpha=.35;
  ctx.strokeStyle='#9b7bff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(stick.ox,stick.oy,STR,0,6.3); ctx.stroke();
  ctx.globalAlpha=.8;
  ctx.fillStyle='#e8e2ff';
  ctx.beginPath(); ctx.arc(stick.ox+dx/d*STR*k, stick.oy+dy/d*STR*k, 21,0,6.3); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}
function drawGround(cx,cy){
  var g=96;
  ctx.strokeStyle=curGround.grid; ctx.lineWidth=1;
  ctx.beginPath();
  var x0=Math.floor(cx/g)*g, y0=Math.floor(cy/g)*g;
  for(var x=x0;x<cx+W+g;x+=g){ ctx.moveTo(x,cy); ctx.lineTo(x,cy+H); }
  for(var y=y0;y<cy+H+g;y+=g){ ctx.moveTo(cx,y); ctx.lineTo(cx+W,y); }
  ctx.stroke();
  ctx.fillStyle=curGround.dot;
  for(var i=0;i<40;i++){
    var px=x0+((i*563)%(W+g*2)), py=y0+((i*911)%(H+g*2));
    ctx.fillRect(px,py,3,3);
  }
}
function drawPlayer(){

  ctx.strokeStyle='#ffd870'; ctx.lineWidth=3; ctx.lineCap='round';

  ctx.restore();
}

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0,e.r*0.85,e.r*0.85,e.r*0.32,0,0,6.3); ctx.fill();
  var hit=e.ht>0, R=e.r;
  // エフェクトに埋もれないよう、まず暗い縁で敵の形を抜く
  ctx.globalAlpha=.85; ctx.fillStyle='#0a0714';
  ctx.beginPath(); ctx.arc(0,0,R+3.5,0,6.3); ctx.fill();
  ctx.globalAlpha=1;
  var bodyCol=hit?'#ffffff':(e.frz>0?'#cfeeff':(e.slow>0?'#8fd4ff':e.col));
  ctx.fillStyle=bodyCol;
  ctx.strokeStyle=hit?'#ffffff':e.dark; ctx.lineWidth=2;

  if(FOREST2[e.shape]){
    drawForestShape(e.shape,R,bodyCol,hit?'#ffffff':e.dark,time);
  }else{
    drawS1Shape(e.shape,R,bodyCol,hit?'#ffffff':e.dark,time);
  }

  // 突進の予告：溜め中はプレイヤー方向へ赤いラインを伸ばす
  if(e.st==='wind'&&e.ai==='charge'){
    var ta=Math.atan2(P.y-e.y,P.x-e.x);
    ctx.save(); ctx.rotate(ta);
    ctx.globalAlpha=0.30+0.25*Math.sin(time*20); ctx.fillStyle='#ff4d4d';
    ctx.beginPath(); ctx.moveTo(R*0.5,-R*0.45); ctx.lineTo(R*6.5,-R*0.14);
    ctx.lineTo(R*6.5,R*0.14); ctx.lineTo(R*0.5,R*0.45); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.restore();
  }
  // 弾幕の予告：溜め中は警告リング
  if(e.st==='wind'&&e.ai==='slam'){
    ctx.strokeStyle='#ffd08a'; ctx.globalAlpha=0.5+0.3*Math.sin(time*24); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,R+12+Math.sin(time*20)*4,0,6.3); ctx.stroke(); ctx.globalAlpha=1;
  }

  // 射撃の予告：狙い澄まし中はリング
  if(e.st==='wind'&&e.ai==='shoot'){
    ctx.strokeStyle='#ffe27a'; ctx.globalAlpha=0.5+0.3*Math.sin(time*22); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,R+7,0,6.3); ctx.stroke(); ctx.globalAlpha=1;
  }

  if(e.el&&ELEM[e.el]){
    var ec=ELEM[e.el].col, pulse=0.6+Math.sin(time*12+e.ph)*0.4;
    ctx.globalAlpha=0.30*pulse;
    ctx.fillStyle=ec; ctx.beginPath(); ctx.arc(0,0,R+6,0,6.3); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=ec; ctx.beginPath(); ctx.arc(0,-R-10,4.5,0,6.3); ctx.fill();
  }
  if(e.boss){
    ctx.strokeStyle='#ff4d6d'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,R+10,0,6.3); ctx.stroke();
  }else if(e.elite){
    ctx.strokeStyle='#ffcc4d'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,R+7,0,6.3); ctx.stroke();
    var bw=R*2.4;
    ctx.fillStyle='#000'; ctx.fillRect(-bw/2,-R-16,bw,5);
    ctx.fillStyle='#ff4d6d'; ctx.fillRect(-bw/2,-R-16,bw*Math.max(0,e.hp/e.mhp),5);
  }
  ctx.restore();
}
// エフェクトに埋もれても敵の位置が分かるよう、最前面に輪郭だけを描く
function drawEnemyOutlines(){
  ctx.save();
  ctx.lineWidth=2;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.dead) continue;
    ctx.globalAlpha=e.boss?0.95:(e.elite?0.9:0.62);
    ctx.strokeStyle=e.ht>0?'#ffffff':(e.boss?'#ff4d6d':(e.elite?'#ffcc4d':'#0a0614'));
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+1,0,6.3); ctx.stroke();
    ctx.globalAlpha=e.boss?0.9:0.5;
    ctx.strokeStyle=e.col;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+3.5,0,6.3); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.restore();
}

function drawChak(c){
  ctx.save();

  ctx.fillStyle='#9fd4ff';
  ctx.beginPath(); ctx.arc(0,0,15,0,6.3); ctx.fill();
  ctx.globalAlpha=c.back?0.75:1;
  ctx.strokeStyle='#eaf4ff'; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.arc(0,0,10,0,6.3); ctx.stroke();
  ctx.fillStyle='#ffffff';
  for(var i=0;i<4;i++){
    var a=i/4*6.283;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);
    ctx.lineTo(Math.cos(a+0.34)*16,Math.sin(a+0.34)*16);
    ctx.lineTo(Math.cos(a+0.68)*9,Math.sin(a+0.68)*9);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();
}

function drawHole(h){

  ctx.rotate(h.t*2.2);
  ctx.globalAlpha=fade*0.13;
  ctx.fillStyle='#7a4fd6'; ctx.beginPath(); ctx.arc(0,0,h.r*k,0,6.3); ctx.fill();

  ctx.beginPath(); ctx.arc(0,0,h.r*k,0,6.3); ctx.stroke();

function drawPillar(f){
  var k=f.t/f.life;
  ctx.save(); ctx.globalAlpha=(1-k)*0.85;
  var w=f.r*(1-k*0.35);
  var g=ctx.createLinearGradient(0,f.y-460,0,f.y);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(255,255,255,0.9)');
  ctx.fillStyle=g; ctx.fillRect(f.x-w,f.y-460,w*2,460);
  ctx.globalAlpha=(1-k);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=4*(1-k)+1;
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.4+k*0.7),0,6.3); ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
}

  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.a);
  ctx.globalAlpha=(1-k)*0.9;
  ctx.fillStyle='#2a1046';
  ctx.strokeStyle='#a855f7'; ctx.lineWidth=2;
  var L=26*reach;
  ctx.beginPath(); ctx.ellipse(-L*0.6,0,14,10,0,0,6.3); ctx.fill(); ctx.stroke();
  for(var i=0;i<4;i++){
    var a=(i-1.5)*0.42;
    ctx.beginPath();
    ctx.moveTo(-L*0.6+Math.cos(a)*10,Math.sin(a)*9);
    ctx.lineTo(-L*0.6+Math.cos(a)*(10+18*reach),Math.sin(a)*(9+15*reach));
    ctx.stroke();
  }
  ctx.globalAlpha=(1-k)*0.35;
  ctx.strokeStyle='#c9a5ff'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(-L*2.4,0); ctx.lineTo(-L*0.6,0); ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
}
function drawQuake(f){
  var k=f.t/f.life;
  ctx.save(); ctx.globalAlpha=1-k;
  ctx.fillStyle='#8f7a58';
  var n=9;
  for(var i=0;i<n;i++){
    var a=i/n*6.283+f.x*0.01;
    var rr=f.r*(0.35+k*0.75);
    var hgt=26*(1-k)*(0.6+((i*37)%10)/14);
    ctx.beginPath();
    ctx.moveTo(f.x+Math.cos(a)*rr-7, f.y+Math.sin(a)*rr);
    ctx.lineTo(f.x+Math.cos(a)*rr,   f.y+Math.sin(a)*rr-hgt);
    ctx.lineTo(f.x+Math.cos(a)*rr+7, f.y+Math.sin(a)*rr);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='#c4a878'; ctx.lineWidth=3*(1-k);
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.35+k*0.75),0,6.3); ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
}
function drawShot(s){
  ctx.save(); ctx.translate(s.x,s.y);
  if(s.kind==='pellet'){
    ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(0,0,s.r,0,6.3); ctx.fill();
    ctx.fillStyle=s.col2; ctx.beginPath(); ctx.arc(0,0,s.r*0.5,0,6.3); ctx.fill();
  }else if(s.kind==='bullet'){
    ctx.rotate(s.ang);
    ctx.strokeStyle=s.col2; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(3,0); ctx.stroke();
    ctx.strokeStyle=s.col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(5,0); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(5,0,2,0,6.3); ctx.fill();
  }else if(s.kind==='wave'){
    ctx.rotate(s.ang);
    ctx.globalAlpha=.85;
    ctx.strokeStyle=s.col; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-14,0,22,-1.15,1.15); ctx.stroke();
    ctx.globalAlpha=.35; ctx.strokeStyle=s.col2; ctx.lineWidth=11;
    ctx.beginPath(); ctx.arc(-16,0,24,-1.0,1.0); ctx.stroke();
    ctx.globalAlpha=1;
  }else if(s.kind==='icejav'){
    ctx.rotate(s.ang);
    // 片方（進行方向）が長いひし形の氷槍
    var fl=16, bl=6, w=5;
    ctx.globalAlpha=.35; ctx.fillStyle=s.col;
    ctx.beginPath(); ctx.arc(0,0,8,0,6.3); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=s.col;
    ctx.beginPath(); ctx.moveTo(fl,0); ctx.lineTo(0,-w); ctx.lineTo(-bl,0); ctx.lineTo(0,w);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=s.col2;
    ctx.beginPath(); ctx.moveTo(fl*0.6,0); ctx.lineTo(0,-w*0.45); ctx.lineTo(-bl*0.6,0); ctx.lineTo(0,w*0.45);
    ctx.closePath(); ctx.fill();
  }else if(s.kind==='arrow'||s.kind==='lance'){
    ctx.rotate(s.ang);
    var L=s.kind==='lance'?20:17;
    ctx.strokeStyle=s.col2; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(L*0.4,0); ctx.stroke();
    ctx.fillStyle=s.col;
    ctx.beginPath(); ctx.moveTo(L,0); ctx.lineTo(L*0.25,-5); ctx.lineTo(L*0.25,5);
    ctx.closePath(); ctx.fill();
    if(s.kind==='lance'){
      ctx.globalAlpha=.3; ctx.fillStyle=s.col;
      ctx.beginPath(); ctx.arc(0,0,10,0,6.3); ctx.fill(); ctx.globalAlpha=1;
    }
  }else{
    ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(0,0,s.r,0,6.3); ctx.fill();
    ctx.fillStyle=s.col2; ctx.beginPath(); ctx.arc(0,0,s.r*0.55,0,6.3); ctx.fill();
  }
  ctx.restore();
}

// 画面外の床の装備を、画面端に「方向矢印＋パッシブアイコン」で示す（画面座標）
function drawRelicMarkers(){
  if(!relics||!relics.length||!P) return;
  if(state==='title'||state==='dead') return;
  var mgn=26, cxp=W/2, cyp=H/2, hw=W/2-mgn, hh=H/2-mgn;
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var i=0;i<relics.length;i++){
    var rl=relics[i];
    var sx=rl.x-P.x+W/2, sy=rl.y-P.y+H/2;
    // 画面内に本体が見えているならマーカー不要
    if(sx>mgn&&sx<W-mgn&&sy>mgn&&sy<H-mgn) continue;
    // 中心から装備方向へレイを飛ばし、画面矩形の端に置く
    var ang=Math.atan2(rl.y-P.y,rl.x-P.x), ux=Math.cos(ang), uy=Math.sin(ang);
    var tx=ux!==0?hw/Math.abs(ux):1e9, ty=uy!==0?hh/Math.abs(uy):1e9, tt=Math.min(tx,ty);
    var mx=cxp+ux*tt, my=cyp+uy*tt;
    mx=Math.max(mgn,Math.min(W-mgn,mx));
    my=Math.max(72,Math.min(H-mgn,my));    // 上部はHUD（タイマー等）を避ける
    // アイコン台
    ctx.globalAlpha=0.92;
    ctx.fillStyle='rgba(16,28,42,.9)'; ctx.strokeStyle='#7fe6ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(mx,my,15,0,6.3); ctx.fill(); ctx.stroke();
    // 方向矢印（装備の向き）
    ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
    ctx.fillStyle='#7fe6ff';
    ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(16,-6); ctx.lineTo(16,6); ctx.closePath(); ctx.fill();
    ctx.restore();
    // パッシブのアイコン
    ctx.globalAlpha=1; ctx.fillStyle='#eafcff'; ctx.font='15px sans-serif';
    ctx.fillText(PASSIVES[rl.id].glyph, mx, my+1);
  }
  ctx.globalAlpha=1; ctx.restore();
}

  ctx.globalAlpha=1; ctx.restore();
}

var slotsEl=document.getElementById('slots');
var slotSig='', slotRefs=[];
function rebuildSlots(){
  slotsEl.innerHTML=''; slotRefs=[];
  var id;
  // 3段構成：上=装備（床装備由来）／中=パッシブ（レベルアップ由来）／下=武器
  var rEq=document.createElement('div'); rEq.className='srow';
  var rPas=document.createElement('div'); rPas.className='srow';
  var rW=document.createElement('div'); rW.className='srow';
  slotsEl.appendChild(rEq); slotsEl.appendChild(rPas); slotsEl.appendChild(rW);
  // 装備段：床装備で得たぶん
  for(id in P.rel){
    if(!P.rel[id]) continue;
    var eq=document.createElement('div'); eq.className='slot eq';
    eq.innerHTML='<div class="sring"></div><div class="sin">'+
      '<div class="ic">'+PASSIVES[id].glyph+'</div>'+
      '<div class="lv">'+P.rel[id]+'</div></div>';
    rEq.appendChild(eq);
  }
  // パッシブ段：レベルアップで得たぶん（総レベル − 装備ぶん）
  for(id in P.p){
    var lvup=(P.p[id]||0)-(P.rel[id]||0);
    if(lvup<=0) continue;
    var q=document.createElement('div'); q.className='slot pas';
    q.innerHTML='<div class="sring"></div><div class="sin">'+
      '<div class="ic">'+PASSIVES[id].glyph+'</div>'+
      '<div class="lv">'+lvup+'</div></div>';
    rPas.appendChild(q);
  }
  // 武器段（クールダウンのリングを回すのは武器だけ）
  for(id in P.w){
    var d=document.createElement('div');
    d.className='slot'+(AW(id)?' evo':'');
    d.innerHTML='<div class="sring"></div><div class="sin">'+
      '<div class="ic">'+WEAPONS[id].glyph+'</div>'+
      '<div class="lv">'+P.w[id]+'</div></div>';
    rW.appendChild(d);
    slotRefs.push({el:d,key:id});
  }
}
function updateSlotRings(){
  for(var i=0;i<slotRefs.length;i++){
    var r=slotRefs[i], mx=coolMax[r.key], c=cool[r.key];
    var p=(!mx||c==null||c<=0)?1:Math.max(0,Math.min(1,1-c/mx));
    r.el.style.setProperty('--p',(p*100).toFixed(1)+'%');
  }
}

  document.getElementById('xpbar').style.width=(P.xp/P.need*100)+'%';

    (m<10?'0':'')+m+':'+(s<10?'0':'')+s+' / 20:00';
  document.getElementById('score').innerHTML='<i>SCORE</i>'+fmt(score);
  document.getElementById('coins').innerHTML=
    '<span class="sv">銀 '+silver+'</span> <span class="gd">金 '+gold+'</span>';
  var bw=document.getElementById('bosswrap');
  if(boss&&!boss.dead){
    if(!bw.classList.contains('on')){
      bw.classList.add('on');
      document.getElementById('bossnm').textContent=boss.nm;
    }
    document.getElementById('bossbar').style.width=Math.max(0,boss.hp/boss.mhp*100)+'%';
  }else if(bw.classList.contains('on')) bw.classList.remove('on');
  document.getElementById('hpbar').style.width=Math.max(0,P.hp/P.max*100)+'%';
  document.getElementById('hptext').textContent=Math.max(0,Math.ceil(P.hp))+' / '+P.max;

  // 構成が変わったときだけ組み直し、縁のタイマーは毎フレーム更新する
  var sig='',k;
  for(k in P.w) sig+=k+P.w[k]+',';
  for(k in P.p) sig+=k+P.p[k]+',';
  if(sig!==slotSig){ slotSig=sig; rebuildSlots(); }
  updateSlotRings();
}

  var c=costOf(lv);

  else   { if(WALLET.silver<c.c) return; WALLET.silver-=c.c; }
  META[id]=lv+1;
  saveGame(); renderShop();
  if(lv+1===umax(id)){
    [0,80,170].forEach(function(ms,i){ setTimeout(function(){ sfx([784,988,1319][i],.16,'triangle',.075); },ms); });
  }else{

function testPassive(id,a){
  var k;
  if(id==='*'){
    for(k in PASSIVES) P.p[k]=(a==='max')?PASSIVES[k].max:0;
  }else{
    var v=(P.p[id]||0)+(a==='+'?1:-1);
    P.p[id]=Math.max(0,Math.min(PASSIVES[id].max,v));
  }
  // 生命は最大HPに直結するので再計算する
  var base=Math.round(100*(1+0.10*M('health')));
  P.max=base+30*(P.p.vital||0);
  P.hp=Math.min(P.hp,P.max);
  slotSig=''; syncHud(); renderTest();
}
function testWeapon(id,a,ax){
  if(a==='eq'){
    if(P.w[id]){ delete P.w[id]; delete P.wa[id]; delete P.aw[id]; }
    else { P.w[id]=1; P.wa[id]={}; }
  }else if(a==='aw'){
    P.aw[id]=P.aw[id]?0:1;
  }else{
    if(!P.wa[id]) P.wa[id]={};
    var v=(P.wa[id][ax]||0)+(a==='+'?1:-1);
    P.wa[id][ax]=Math.max(0,Math.min(WAX[id][ax],v));
    P.w[id]=wLvFromAx(id);
  }
  slotSig=''; syncHud(); renderTest();
}
function testAction(a){
  var id;
  if(a==='lv10'||a==='lv100'){
    var tgt=(a==='lv100')?100:P.lv+10;
    while(P.lv<tgt){ P.lv++; P.need=xpNeed(P.lv); pending++; }
    P.xp=0;
  }
  else if(a==='t60') time+=60;
  else if(a==='t300') time+=300;
  else if(a==='wipe'){ for(var i=0;i<enemies.length;i++) if(!enemies[i].boss) enemies[i].dead=1; }
  else if(a==='heal') P.hp=P.max;
  else if(a==='coin'){ silver+=100; gold+=100; }
  else if(a==='god') P.god=P.god?0:1;
  else if(a==='nodmg') P.nodmg=P.nodmg?0:1;
  else if(a==='allmax'){
    for(id in WEAPONS){
      if(!P.w[id]){ P.w[id]=1; P.wa[id]={}; }
      var left=9, a2=P.wa[id];
      for(var ax in WAX[id]){
        var add=Math.min(WAX[id][ax]-(a2[ax]||0),left);
        a2[ax]=(a2[ax]||0)+add; left-=add;
        if(left<=0) break;
      }
      P.w[id]=wLvFromAx(id); P.aw[id]=1;
    }
  }
  else if(a==='lb10'){
    for(id in P.w){
      if(!P.lb[id]) P.lb[id]={};
      for(var k in LBN){
        if(!lbOK(id,k)) continue;
        var v=(P.lb[id][k]||0)+10;
        if(LBCAP[k]) v=Math.min(LBCAP[k],v);
        P.lb[id][k]=v;
      }
    }
  }
  else if(a==='clear'){
    P.w={}; P.wa={}; P.aw={}; P.lb={};
    P.w[CH().w]=1; P.wa[CH().w]={};
  }
  slotSig=''; syncHud(); renderTest();
}

function damageBreakdownHtml(){

  for(k in WDMG){ if(WDMG[k]>0){ arr.push([k,WDMG[k]]); tot+=WDMG[k]; } }
  if(!tot) return '';
  arr.sort(function(a,b){ return b[1]-a[1]; });
  var mx=arr[0][1]||1;
  var rows='';
  for(var i=0;i<arr.length;i++){
    var id=arr[i][0], dm=arr[i][1], pct=Math.round(dm/tot*100);
    var barw=Math.max(3,Math.round(dm/mx*100));   // バーは1位基準（見やすさ）、%は全体比
    var nm,gl;
    if(id==='_react'){ nm='元素反応'; gl='✦'; }
    else if(WEAPONS[id]){ nm=WEAPONS[id].nm; gl=WEAPONS[id].glyph; }
    else { nm=id; gl='•'; }
    rows+='<div class="dmgrow">'+
      '<span class="dg">'+gl+'</span>'+
      '<span class="dn">'+nm+'</span>'+
      '<span class="dbar"><span class="dfill" style="width:'+barw+'%"></span></span>'+
      '<span class="dpct">'+pct+'%</span>'+
      '<span class="dval">'+fmt(dm)+'</span>'+
    '</div>';
  }
  return '<div class="dmgtitle">与ダメージ内訳</div><div class="dmglist">'+rows+'</div>';
}
function finish(won){

  pauseEl.classList.remove('on');
  document.getElementById('pick').classList.remove('on');
  document.getElementById('chest').classList.remove('on');
  if(won){
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i];
      for(var k=0;k<4;k++) parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*300,
        vy:(Math.random()-.5)*300,t:0,life:.5,col:e.col,s:3});
    }
    enemies.length=0; chests.length=0;
    flash=1; shake=24;
    sfx(523,.5,'triangle',.09);
    setTimeout(function(){ sfx(784,.6,'triangle',.09); },160);
    setTimeout(function(){ sfx(1046,.9,'triangle',.09); },330);
  }else{
    sfx(220,.8,'sawtooth',.1,.25);
  }
  var m=Math.floor(time/60), s=Math.floor(time%60);
  var bTime=Math.floor(time)*PTS_SEC, bLv=P.lv*PTS_LV, bClear=won?PTS_CLEAR:0;
  var base=score;
  score=base+bTime+bLv+bClear;
  var rec=score>best;
  if(rec) best=score;
  ACH.lv=Math.max(ACH.lv,P.lv);
  ACH.kills+=kills; ACH.reacts+=reacts;
  ACH.time=Math.max(ACH.time,Math.floor(time));
  if(won){ ACH.clear=1; STGCLEAR[curStage]=1; }
  var newCh=unlockCheck();
  WALLET.silver+=silver; WALLET.gold+=gold;
  var wtxt=[];
  for(var wk in wxRun){
    if(wxRun[wk]<1) continue;
    WX[wk]=(WX[wk]||0)+wxRun[wk];
    if(WEAPONS[wk]) wtxt.push(WEAPONS[wk].nm+' +'+fmt(wxRun[wk]));
  }
  saveGame();
  var names=[]; for(var id in P.w) names.push(WEAPONS[id].nm+' '+P.w[id]+(AW(id)?'★':''));
  document.getElementById('vtitle').textContent=won?'討伐完了':(time>=RUN?'敗北':'力尽きた');
  document.getElementById('vtitle').style.color=won?'#56e0ff':'#ffcc4d';
  document.getElementById('res').innerHTML=
    '<div style="font-size:30px;color:#fff;letter-spacing:2px;margin:6px 0 2px">'+fmt(score)+'</div>'+
    '<div style="font-size:12px;color:#6b5f9c;margin-bottom:10px">'+
      '撃破 '+fmt(base)+'　生存 +'+fmt(bTime)+'　Lv +'+fmt(bLv)+
      (bClear?'　完走 +'+fmt(bClear):'')+'</div>'+
    (rec?'<div style="color:var(--gold);font-size:15px;margin-bottom:6px">★ 自己ベスト更新</div>'
        :'<div style="font-size:12px;color:#6b5f9c;margin-bottom:6px">ベスト '+fmt(best)+'</div>')+
    '生存 <b>'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s+' / 20:00</b>　討伐 <b>'+kills+'</b> 体<br>'+
    '到達 <b>Lv '+P.lv+'</b>　元素反応 <b>'+reacts+'</b> 回<br>'+
    '持ち帰り <b>銀貨 +'+silver+' / 金貨 +'+gold+'</b><br>'+
    '熟練度 <b>'+(wtxt.join('　')||'—')+'</b><br>'+
    (anyPicks()?'<span style="color:var(--gold)">★ 武器熟練で特性を選べます</span><br>':'')+
    '構成 <b>'+(names.join(' / ')||'—')+'</b>'+
    (newCh.length?'<br><span style="color:var(--gold)">★ '+newCh.join('・')+' が解放されました</span>':'')+
    damageBreakdownHtml();
  showView('result');
  document.getElementById('veil').classList.remove('hide');
}
/* ============ ホーム / ステージ選択 / 結果 の画面切替 ============ */
var homeView='home';
function showView(v){
  homeView=v;
  document.getElementById('homeview').style.display  = v==='home' ?'flex':'none';
  document.getElementById('stageview').style.display = v==='stage'?'flex':'none';
  document.getElementById('resultview').style.display= v==='result'?'flex':'none';
  if(v==='home'){ syncTitle(); playBGM('home'); }
  else if(v==='stage') renderStageSelect();
}
function startRun(n){
  audio();
  if(n!=null) curStage=n;
  document.getElementById('veil').classList.add('hide');
  ['paused','shop','mast','ban','settings','news','bosswrap','chest','test','chr'].forEach(function(id){
    var e=document.getElementById(id); if(e) e.classList.remove('on');
  });
  document.getElementById('res').innerHTML='';
  reset(); state='playing'; last=performance.now();
  playBGM('s'+curStage);
}
function renderStageSelect(){
  document.getElementById('stagechar').innerHTML=
    '<span class="chg">'+CH().glyph+'</span>'+
    '<span class="chn">'+CH().nm+'</span>'+
    '<span class="chw">初期武器：'+WEAPONS[CH().w].nm+'</span>';
  var el=document.getElementById('stagesel'); el.innerHTML='';
  var ns=Object.keys(STAGES).map(Number).sort(function(a,b){return a-b;}), h='';
  for(var i=0;i<ns.length;i++){
    var n=ns[i], st=STAGES[n], un=stageUnlocked(n), cl=STGCLEAR[n];
    var head=un?((STGNUM[n-1]||n)+' '+st.nm):('🔒 '+st.nm);
    var note=un?(st.sub+(cl?'・クリア済':'')+'　▶ 出撃'):'前ステージのクリアで解放';
    h+='<button class="stbtn'+(un?'':' lock')+'" data-stg="'+n+'"'+(un?'':' disabled')+'>'+
       '<b>'+head+'</b><span>'+note+'</span></button>';
  }
  el.innerHTML=h;
  el.onclick=function(ev){
    var b=ev.target.closest?ev.target.closest('.stbtn'):null; if(!b) return;
    var n=+b.getAttribute('data-stg'); if(!stageUnlocked(n)) return;
    startRun(n);
  };
}
document.getElementById('startbtn').onclick=function(){ audio(); showView('stage'); };
document.getElementById('stageback').onclick=function(){ showView('home'); };
document.getElementById('againbtn').onclick=function(){ startRun(curStage); };
document.getElementById('homebtn').onclick=function(){ showView('home'); };

/* ============ 設定（ホーム右上の歯車）============ */
var setEl=document.getElementById('settings');
function renderSettings(){
  document.getElementById('volm').value=Math.round(VOLM*100);
  document.getElementById('volmval').textContent=Math.round(VOLM*100)+'%';
  document.getElementById('vols').value=Math.round(VOLS*100);
  document.getElementById('volsval').textContent=Math.round(VOLS*100)+'%';
  document.getElementById('volb').value=Math.round(VOLB*100);
  document.getElementById('volbval').textContent=Math.round(VOLB*100)+'%';
  var pb=document.getElementById('setperf'); pb.textContent=PERF?'ON':'OFF'; pb.classList.toggle('on',!!PERF);
  Array.prototype.forEach.call(document.querySelectorAll('#setshake button'),function(b){
    b.classList.toggle('on',parseFloat(b.getAttribute('data-s2'))===SHK);
  });
}
document.getElementById('setbtn').onclick=function(){ audio(); renderSettings(); setEl.classList.add('on'); };
document.getElementById('setclose').onclick=function(){ setEl.classList.remove('on'); };
document.getElementById('volm').oninput=function(){ VOLM=(+this.value)/100; document.getElementById('volmval').textContent=this.value+'%'; syncBgmGain(); };
document.getElementById('volm').onchange=function(){ VOLM=(+this.value)/100; saveGame(); sfx(880,.08,'triangle',.06); };
document.getElementById('vols').oninput=function(){ VOLS=(+this.value)/100; document.getElementById('volsval').textContent=this.value+'%'; };
document.getElementById('vols').onchange=function(){ VOLS=(+this.value)/100; saveGame(); sfx(880,.08,'triangle',.06); };
document.getElementById('volb').oninput=function(){ VOLB=(+this.value)/100; document.getElementById('volbval').textContent=this.value+'%'; syncBgmGain(); };
document.getElementById('volb').onchange=function(){ VOLB=(+this.value)/100; saveGame(); };
document.getElementById('setperf').onclick=function(){ PERF=PERF?0:1; document.getElementById('perf').classList.toggle('on',!!PERF); fpsA=[];fpsI=0;perfT=0; syncPerfBtn(); renderSettings(); };
Array.prototype.forEach.call(document.querySelectorAll('#setshake button'),function(b){
  b.onclick=function(){ SHK=parseFloat(b.getAttribute('data-s2')); saveGame(); syncShakeBtns(); renderSettings(); };
});

/* ============ お知らせ（ホーム右上のメール）============ */

  {t:'ホーム画面リニューアル', d:'UPDATE', b:'出撃 → ステージ選択の流れに変更。右上に設定（音量 / FPS / 画面揺れ）とお知らせを追加しました。'},

];
var newsEl=document.getElementById('news');
function renderNews(){
  var L=document.getElementById('newslist'); L.innerHTML='';
  for(var i=0;i<NEWS.length;i++){
    var n=NEWS[i], d=document.createElement('div'); d.className='newsitem';

    L.appendChild(d);
  }
}
document.getElementById('newsbtn').onclick=function(){ audio(); renderNews(); newsEl.classList.add('on'); };
document.getElementById('newsclose').onclick=function(){ newsEl.classList.remove('on'); };

showView('home');
